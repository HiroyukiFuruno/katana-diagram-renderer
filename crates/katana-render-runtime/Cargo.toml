[package]
name = "katana-render-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description.workspace = true
include = [
    "Cargo.toml",
    "assets/fonts/**",
    "src/**/*.rs",
    "src/renderer/backends/html_runtime/*.js",
    "src/markdown/diagram_runtime/generated/*.js",
    "src/markdown/diagram_runtime/generated/*.sha256",
    "vendor/drawio/30.0.4/**",
    "vendor/mermaid/11.15.0/**",
    "vendor/mermaid-zenuml/0.2.3/**",
    "vendor/plantuml/1.2026.6/plantuml.jar.sha256",
    "vendor/zenuml-core/3.47.9/**",
    "src/markdown/drawio_renderer/js_runtime/resources/shapes/**",
    "src/markdown/drawio_renderer/js_runtime/resources/stencils/**",
]

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
include_dir = { workspace = true }
jni = { workspace = true }
html5ever = { workspace = true }
markup5ever_rcdom = { workspace = true }
resvg = { workspace = true }
rustybuzz = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tiny-skia = { workspace = true }
tracing = { workspace = true }
ureq = { workspace = true }
url = { version = "2.5", features = ["serde"] }
v8 = { workspace = true }
xmltree = { workspace = true }
percent-encoding = { workspace = true }
taffy = { workspace = true }
cssparser = { workspace = true }
unicode-linebreak = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
