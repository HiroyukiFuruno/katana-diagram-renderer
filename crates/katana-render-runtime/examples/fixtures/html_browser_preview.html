<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KRR interactive HTML browser preview fixture</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #18202a;
    }

    body {
      margin: 0;
      min-height: 720px;
      background: #eef3f8;
    }

    main {
      position: relative;
      width: 896px;
      height: 656px;
      margin: 32px;
      background: white;
      border: 1px solid #c9d6e4;
      box-shadow: 0 18px 54px rgba(34, 52, 75, 0.18);
      padding: 32px 36px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      line-height: 1.15;
    }

    .top-link {
      position: absolute;
      top: 30px;
      right: 36px;
      display: inline-flex;
      align-items: center;
      height: 42px;
      padding: 0 16px;
      background: #173f5f;
      color: white;
      font-weight: 800;
      text-decoration: none;
    }

    .grid {
      display: grid;
      grid-template-columns: 520px 220px;
      gap: 24px;
      align-items: center;
      margin-top: 18px;
    }

    .status {
      display: inline-block;
      margin-top: 14px;
      padding: 8px 12px;
      background: #e6f5ef;
      border: 1px solid #9fd4be;
      color: #12513a;
      font-weight: 700;
    }

    details {
      margin-top: 22px;
      width: 440px;
      border: 1px solid #93b4cf;
      background: #f7fbff;
    }

    summary {
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      color: #173f5f;
      font-weight: 800;
      cursor: pointer;
    }

    .panel {
      border-top: 1px solid #c9d6e4;
      padding: 18px;
      background: white;
    }

    .action {
      margin: 0 0 16px;
    }

    label {
      display: block;
      font-weight: 800;
      color: #263746;
    }

    input {
      display: block;
      width: 220px;
      height: 36px;
      margin-top: 8px;
      border: 1px solid #93b4cf;
      padding: 0 10px;
      font: inherit;
    }

    svg {
      width: 220px;
      height: 160px;
    }

    button {
      margin-top: 20px;
      padding: 10px 16px;
      border: 0;
      background: #1f5f8b;
      color: white;
      font-weight: 700;
    }

    .result {
      margin-top: 12px;
      min-height: 24px;
      color: #7a3e1d;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main>
    <h1>KRR Chromium HTML Preview</h1>
    <p>This fixture verifies browser-owned HTML parsing, CSS layout, SVG paint, click actions, form input, an accordion, and link navigation.</p>
    <div class="grid">
      <section>
        <p class="status" data-js-status>JavaScript has not executed</p>
        <details data-accordion>
          <summary>Accordion: interactive details</summary>
          <div class="panel">
            <button class="action" type="button" data-action-button>Run click action</button>
            <label>
              Type target
              <input data-text-input aria-label="Type target" autocomplete="off">
            </label>
            <p class="result" data-result>Waiting for interaction</p>
          </div>
        </details>
      </section>
      <svg viewBox="0 0 220 160" role="img" aria-label="Painted SVG chart">
        <rect x="10" y="10" width="200" height="140" rx="12" fill="#edf5fb" stroke="#8fb4d0"></rect>
        <rect x="34" y="86" width="32" height="44" fill="#1f5f8b"></rect>
        <rect x="82" y="62" width="32" height="68" fill="#4b7f52"></rect>
        <rect x="130" y="38" width="32" height="92" fill="#9b5c3f"></rect>
        <path d="M28 130 H190" stroke="#263746" stroke-width="3"></path>
      </svg>
    </div>
    <a class="top-link" href="linked-panel.html" data-navigation-link data-target-url="linked-panel.html">Open link</a>
  </main>
  <script>
    const status = document.querySelector("[data-js-status]");
    const result = document.querySelector("[data-result]");
    const input = document.querySelector("[data-text-input]");
    status.textContent = "JavaScript executed inside Chromium";
    document.body.dataset.krrReady = "true";
    document.querySelector("[data-accordion]").addEventListener("toggle", (event) => {
      status.textContent = event.currentTarget.open
        ? "Accordion opened by Chromium click"
        : "Accordion closed";
    });
    document.querySelector("[data-action-button]").addEventListener("click", () => {
      result.textContent = "Button click mutated the DOM";
      result.style.color = "rgb(18, 81, 58)";
    });
    input.addEventListener("input", () => {
      result.textContent = `Typed text reached Chromium: ${input.value}`;
      result.style.color = "rgb(31, 95, 139)";
    });
    document.querySelector("[data-navigation-link]").addEventListener("click", (event) => {
      event.preventDefault();
      window.__katanaNavigation = new URL(event.currentTarget.dataset.targetUrl, document.baseURI).href;
      status.textContent = "Link click emitted navigation";
    });
  </script>
</body>
</html>
