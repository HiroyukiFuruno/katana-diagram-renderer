name: release-preflight

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0. Defaults to Cargo.toml version."
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  TEST_THREADS: "1"

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Skip non-release pull request
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/v')
        run: echo "release-preflight is skipped for non-release pull requests."

      - name: Checkout
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Java runtime
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Linux runtime test prerequisites
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk graphviz

      - name: Install Rust
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache cargo
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: release-preflight-ubuntu-stable-all-features

      - name: Install Bun
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install JavaScript dependencies
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        run: bun install --frozen-lockfile

      - name: Install just
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        uses: taiki-e/install-action@just

      - name: Install cargo-llvm-cov
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Resolve version
        id: version
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        shell: bash
        run: |
          bash scripts/release/resolve-release-version.sh \
            "${{ github.event_name }}" \
            "${{ inputs.version }}" \
            "${{ github.head_ref }}"

      - name: Release target check
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: just VERSION="${{ steps.version.outputs.version }}" release-target-check

      - name: Release check
        if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
        timeout-minutes: 75
        run: just VERSION="${{ steps.version.outputs.version }}" release-check
