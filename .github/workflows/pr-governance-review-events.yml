name: PR governance review sensor

on:
  # This workflow intentionally has no write permission, secrets, checkout, or
  # PR-controlled command. Its uniquely named check is the required Actions
  # latch; a trusted default-branch publisher must complete a matching App Check Run
  # to this run before this job may succeed.
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  pull_request_review_comment:
    types:
      - created
      - edited
      - deleted

permissions:
  actions: read
  checks: read

concurrency:
  group: pr-governance-review-latch-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review-latch:
    name: KRR / PR governance review latch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Reject sensor reruns
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [[ "${RUN_ATTEMPT}" != 1 ]]; then
            echo 'Sensor reruns cannot reuse a previous source_run_id.' >&2
            exit 1
          fi

      - name: Reject Draft state
        if: github.event.pull_request.draft
        run: |
          echo 'Draft PR cannot satisfy the governance review latch.' >&2
          exit 1

      - name: Await matching trusted governance Check Run
        if: github.event.pull_request.draft == false
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          CHECK_APP_ID: ${{ vars.KRR_GOVERNANCE_APP_ID }}
          POLL_INTERVAL_SECONDS: '5'
          POLL_TIMEOUT_SECONDS: '840'
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          from urllib.parse import parse_qs, urlencode, urlsplit

          check_name = "KRR / PR governance (trusted check)"
          sha_pattern = re.compile(r"^[0-9a-fA-F]{40}$")
          positive_number = re.compile(r"^[1-9][0-9]*$")

          def fail(message: str) -> None:
              print(message, file=sys.stderr)
              raise SystemExit(1)

          head_sha = os.environ.get("HEAD_SHA", "")
          source_run_id = os.environ.get("SOURCE_RUN_ID", "")
          app_id = os.environ.get("CHECK_APP_ID", "")
          if sha_pattern.fullmatch(head_sha) is None:
              fail("PR head SHA is invalid.")
          if positive_number.fullmatch(source_run_id) is None:
              fail("Sensor source run ID is invalid.")
          if positive_number.fullmatch(app_id) is None:
              fail("KRR_GOVERNANCE_APP_ID is not configured.")

          try:
              interval = int(os.environ["POLL_INTERVAL_SECONDS"])
              timeout = int(os.environ["POLL_TIMEOUT_SECONDS"])
          except (KeyError, ValueError):
              fail("Governance latch polling configuration is invalid.")
          if interval < 1 or timeout < interval:
              fail("Governance latch polling configuration is invalid.")

          def check_matches_source(check: object) -> bool:
              if not isinstance(check, dict) or check.get("name") != check_name:
                  return False
              details_url = check.get("details_url")
              if not isinstance(details_url, str):
                  return False
              app = check.get("app")
              if not isinstance(app, dict) or str(app.get("id")) != app_id:
                  return False
              if check.get("head_sha") != head_sha or check.get("external_id") != f"krr-governance/v1/{head_sha.lower()}":
                  return False
              try:
                  source_values = parse_qs(
                      urlsplit(details_url).query,
                      keep_blank_values=True,
                  ).get("source_run_id")
              except ValueError:
                  return False
              return source_values == [source_run_id]

          deadline = time.monotonic() + timeout
          endpoint = f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{head_sha}/check-runs?" + urlencode({"check_name": check_name, "app_id": app_id, "filter": "all", "per_page": 100})
          while True:
              result = subprocess.run(
                  ["gh", "api", "--paginate", "--slurp", endpoint],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              if result.returncode != 0:
                  fail("Unable to read the trusted governance Check Run.")
              try:
                  pages = json.loads(result.stdout)
              except json.JSONDecodeError:
                  fail("Trusted governance Check Run response is not JSON.")
              if not isinstance(pages, list) or not all(
                  isinstance(page, dict) and isinstance(page.get("check_runs"), list)
                  for page in pages
              ):
                  fail("Trusted governance Check Run response is invalid.")

              matches = [check for page in pages for check in page.get("check_runs", []) if check_matches_source(check)]
              if len(matches) > 1:
                  fail("Multiple trusted governance Check Runs match this sensor run.")
              if matches:
                  terminal = matches[0]
                  if terminal.get("status") == "completed" and terminal.get("conclusion") == "success":
                      raise SystemExit(0)
                  if terminal.get("status") == "completed":
                      fail("Trusted governance publisher reported failure.")

              if time.monotonic() >= deadline:
                  fail("Timed out waiting for a matching trusted governance Check Run.")
              time.sleep(interval)
          PY
