          before=request([protection_endpoint],env=admin_env); _required,before_records=records(before)
          if before_records.count((context,app_id))!=1 or any(name==context and owner!=app_id for name,owner in before_records): raise SystemExit("Affected-head barrier branch protection drifted before release.")
          expected=copy.deepcopy(before); expected_required=expected["required_status_checks"]; expected_required["checks"]=[{"context":name,"app_id":owner} for name,owner in before_records if name!=context]; expected_required["contexts"]=[name for name,_ in before_records if name!=context]
          response=mutate("DELETE"); after=request([protection_endpoint],env=admin_env); _after_required,after_records=records(after)
