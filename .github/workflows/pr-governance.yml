                      tip = default_tip(default_branch)
                      final_repository = subprocess.run(["gh", "api", f"repos/{repository}"], capture_output=True, text=True, check=False, timeout=20)
                      final_source = subprocess.run(["gh", "api", f"repos/{repository}/pulls/{source_number_value}"], capture_output=True, text=True, check=False, timeout=20)
                      final_tip = default_tip(default_branch)
                      try:
                          final_repo = json.loads(final_repository.stdout) if final_repository.returncode == 0 else None
                          final_pull = json.loads(final_source.stdout) if final_source.returncode == 0 else None
                      except json.JSONDecodeError:
                          final_repo = None
                          final_pull = None
                      final_base = final_pull.get("base") if isinstance(final_pull, dict) else None
                      final_head = final_pull.get("head") if isinstance(final_pull, dict) else None
                      final_base_repo = final_base.get("repo") if isinstance(final_base, dict) else None
                      final_head_repo = final_head.get("repo") if isinstance(final_head, dict) and "repo" in final_head else object()
                      if (
                          tip is None or current_base["sha"] != tip
                          or not isinstance(final_repo, dict) or final_repo.get("default_branch") != default_branch
                          or final_tip != tip
                          or not isinstance(final_pull, dict) or type(final_pull.get("number")) is not int or final_pull.get("number") != source_number_value or final_pull.get("state") != "open"
                          or not isinstance(final_base, dict) or not isinstance(final_head, dict)
                          or final_base.get("ref") != default_branch or final_base.get("sha") != tip or final_head.get("sha") != source_head
                          or not isinstance(final_base_repo, dict) or final_base_repo.get("full_name") != repository
                          or foreign_head_binding(final_head_repo) != current_foreign_head
                      ):
                          raise SystemExit("pull_request_target current fork source drifted.")
              if current_base_ref != default_branch or not source_is_local:
                  # A public fork is outside the App's governance domain. A
                  # local retarget can, however, remove a former duplicate
                  # closer. Revalidate every current governed claimant of the
                  # prior default-base contract before excluding its source.
                  if (
                      os.environ.get("PR_ACTION") == "edited"
                      and source_is_local
                      and current_base_ref != default_branch
                  ):
                      previous_base_ref = os.environ.get("PR_PREVIOUS_BASE_REF")
                      affected = set()
                      # GitHub omits changes.base on ordinary edits to an
                      # already non-default PR. That is not a retarget and
                      # retains the historical no-op domain boundary.
                      if previous_base_ref == "":
                          pass
                      elif (
                          not isinstance(previous_base_ref, str)
                          or re.fullmatch(r"[A-Za-z0-9._/-]+", previous_base_ref) is None
                          or previous_base_ref in {".", ".."}
                          or previous_base_ref.startswith("/")
                          or "//" in previous_base_ref
                          or any(part in {"", ".", ".."} for part in previous_base_ref.split("/"))
                      ):
                          raise SystemExit("pull_request_target prior base is invalid.")
                      elif previous_base_ref == default_branch:
                          # The event provides the old body only when it also
                          # changed. Union both forms so a base-only retarget
                          # preserves the former body while a combined edit
                          # cannot leave either claimant stale.
                          for body in (os.environ.get("PR_BODY", ""), os.environ.get("PR_PREVIOUS_BODY", "")):
                              if not isinstance(body, str):
                                  raise SystemExit("pull_request_target body is invalid.")
                              for source_issue in closing_numbers(body):
                                  affected |= referenced(int(source_issue))
                  else:
                      affected = set()
              else:
                  affected = {source_number_value} if source_number_value in numbers else set()
                  for body in (os.environ.get("PR_BODY", ""), os.environ.get("PR_PREVIOUS_BODY", "")):
                      if not isinstance(body, str):
                          raise SystemExit("pull_request_target body is invalid.")
                      for source_issue in closing_numbers(body):
                          affected |= referenced(int(source_issue))
              # Every PR mutation can change the Issue/closer contract, so
              # preempt the repository-wide arbiter for the exact affected
              # target set.  CI/release workflow_run traffic is handled below
              # and never receives this priority path.
              priority_event = True
          else:
              issue_number = os.environ.get("ISSUE_NUMBER", "")
              if re.fullmatch(r"[1-9][0-9]*", issue_number) is None:
                  raise SystemExit("Issue event number is invalid.")
              issue = int(issue_number)
              affected = referenced(issue)
              if event_name == "issue_comment" and os.environ.get("ISSUE_PULL_REQUEST_URL", "") and issue in numbers:
                  affected.add(issue)
                  source_number_value = issue
              priority_event = True
          ordered_targets = (
              ([source_number_value] if source_number_value in affected else [])
              + sorted(affected - ({source_number_value} if source_number_value in affected else set()))
          )
          # Contract mutations receive the bounded priority writer.  CI and
          # release workflow_run events remain normal reconciliations; only
          # the review-sensor workflow_run is a priority source.
          if event_name == "workflow_run":
              priority_event = (
                  run.get("name") == "PR governance review sensor"
                  and run.get("event") in {"pull_request", "pull_request_review", "pull_request_review_comment"}
              )
          priority_targets = ordered_targets if priority_event else []
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              # resolver-failure barrier is armed before this mutable
              # snapshot. Even an event with no current direct target needs
              # the complete reconciliation below to prove it may release
              # that repository-wide required context.
              output.write("reconcile=true\n")
              output.write("event_targets=" + json.dumps(ordered_targets, separators=(",", ":")) + "\n")
              output.write("priority_targets=" + json.dumps(priority_targets, separators=(",", ":")) + "\n")
          PY

  reconcile-all-open:
    name: Reconcile all current governance pull requests
    needs: resolve_event
    if: needs.resolve_event.outputs.reconcile == 'true' && github.run_attempt == 1
    environment: pr-governance
    runs-on: ubuntu-latest
    timeout-minutes: 290
    # 通常の全件走査は直列化する。一方、PR / Issue contract mutation と
    # review-sensor workflow_run はこの走査を中断して先に fail-closed
    # barrier を作る。CI / release workflow_run は通常走査のままにする。
    # 中断された走査の terminal PATCH は Check Run fingerprint fence で
    # 拒否され、次の全件走査が current snapshot から収束させる。
    concurrency:
      group: pr-governance-dispatcher-${{ github.repository_id }}
      cancel-in-progress: ${{ needs.resolve_event.outputs.priority_targets != '[]' }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Re-enumerate every current local governance pull request
        id: current-targets
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TARGETS: ${{ needs.resolve_event.outputs.event_targets }}
          EVENT_PRIORITY_TARGETS: ${{ needs.resolve_event.outputs.priority_targets }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          repository = os.environ["GITHUB_REPOSITORY"]
          try:
              event_targets = json.loads(os.environ.get("EVENT_TARGETS", ""))
              event_priority_targets = json.loads(os.environ.get("EVENT_PRIORITY_TARGETS", ""))
          except json.JSONDecodeError as error:
              raise SystemExit("Event target boundary is invalid.") from error
          if not isinstance(event_targets, list) or any(type(number) is not int or number < 1 for number in event_targets) or len(set(event_targets)) != len(event_targets):
              raise SystemExit("Event target boundary is invalid.")
          if not isinstance(event_priority_targets, list) or any(type(number) is not int or number < 1 for number in event_priority_targets) or len(set(event_priority_targets)) != len(event_priority_targets) or any(number not in event_targets for number in event_priority_targets):
              raise SystemExit("Event priority target boundary is invalid.")
          repo_result = subprocess.run(["gh", "api", f"repos/{repository}"], capture_output=True, text=True, check=False, timeout=20)
          if repo_result.returncode != 0:
              raise SystemExit("Unable to load repository default branch.")
          try:
              repo = json.loads(repo_result.stdout)
              branch = repo.get("default_branch") if isinstance(repo, dict) else None
          except json.JSONDecodeError as error:
              raise SystemExit("Repository response is not JSON.") from error
          if not isinstance(branch, str) or re.fullmatch(r"[A-Za-z0-9._/-]+", branch) is None:
              raise SystemExit("Repository default branch is invalid.")
          head_result = subprocess.run(["gh", "api", f"repos/{repository}/git/ref/heads/{branch}"], capture_output=True, text=True, check=False, timeout=20)
          if head_result.returncode != 0:
              raise SystemExit("Unable to load repository default head.")
          try:
              writer_head = json.loads(head_result.stdout).get("object", {}).get("sha")
          except json.JSONDecodeError as error:
              raise SystemExit("Repository default head is not JSON.") from error
          if not isinstance(writer_head, str) or re.fullmatch(r"[0-9a-fA-F]{40}", writer_head) is None:
              raise SystemExit("Repository default head is invalid.")
          def pull_page(page_number):
              arguments = ["gh", "api", f"repos/{repository}/pulls?state=open&per_page=100&page={page_number}"]
              if page_number == 6:
                  arguments.insert(2, "--include")
              try:
                  result = subprocess.run(arguments, capture_output=True, text=True, check=False, timeout=20)
              except subprocess.TimeoutExpired as error:
                  raise SystemExit("Current open pull request response timed out.") from error
              if result.returncode != 0:
                  raise SystemExit("Unable to enumerate current open pull requests.")
              try:
                  raw = result.stdout
                  if page_number == 6:
                      headers, separator, raw = raw.replace("\r\n", "\n").partition("\n\n")
                      if not separator or not headers.startswith("HTTP/") or re.search(r'(?im)^link:.*rel="next"', headers):
                          raise SystemExit("Current open pull request response exceeds the fixed page window.")
                  page = json.loads(raw)
              except json.JSONDecodeError as error:
                  raise SystemExit("Current open pull request response is not JSON.") from error
              if not isinstance(page, list) or len(page) > 100 or not all(isinstance(pull, dict) for pull in page):
                  raise SystemExit("Current open pull request response is invalid.")
              return page
          pages = [pull_page(1)]
          for page_number in range(2, 7):
              if len(pages[-1]) < 100:
                  break
              pages.append(pull_page(page_number))
          if pull_page(1) != pages[0]:
              raise SystemExit("Current open pull request response first page changed.")
          seen: set[int] = set()
          targets: list[int] = []
          target_snapshots: dict[int, tuple[str, bool]] = {}
          # The all-open invalidator only needs the immutable head/draft
          # snapshot. Priority pre-invalidation additionally records the
          # pull-request identity domain so a retarget/fork cannot borrow a
          # pending Check Run made for the former contract.
          priority_identity_snapshots: dict[int, tuple[str, bool, str, str, str]] = {}
          governed_heads: dict[str, list[int]] = {}
          for page in pages:
              for pull in page:
                  number = pull.get("number") if isinstance(pull, dict) else None
                  if type(number) is not int or number < 1 or number in seen or pull.get("state") != "open":
                      raise SystemExit("Current open pull request response is invalid.")
                  seen.add(number)
                  body = pull.get("body")
                  if body is not None and not isinstance(body, str):
                      raise SystemExit("Current open pull request body is invalid.")
                  base = pull.get("base") if isinstance(pull, dict) else None
                  head = pull.get("head") if isinstance(pull, dict) else None
                  base_repository = base.get("repo") if isinstance(base, dict) else None
                  head_repository = head.get("repo") if isinstance(head, dict) and "repo" in head else None
                  if not isinstance(base_repository, dict):
                      raise SystemExit("Current open pull request repository binding is invalid.")
                  if not isinstance(head, dict) or "repo" not in head:
                      raise SystemExit("Current open pull request repository binding is invalid.")
                  if head_repository is None:
                      continue
                  if not isinstance(head_repository, dict):
                      raise SystemExit("Current open pull request repository binding is invalid.")
                  base_name = base_repository.get("full_name")
                  head_name = head_repository.get("full_name")
                  base_ref = base.get("ref")
                  if base_name == repository and head_name == repository and base_ref == branch:
                      head_sha = head.get("sha")
                      if not isinstance(head_sha, str) or re.fullmatch(r"[0-9a-fA-F]{40}", head_sha) is None:
                          raise SystemExit("Current open pull request head is invalid.")
                      draft = pull.get("draft")
                      if type(draft) is not bool:
                          raise SystemExit("Current open pull request draft state is invalid.")
                      targets.append(number)
                      normalized_head = head_sha.lower()
                      target_snapshots[number] = (normalized_head, draft)
                      priority_identity_snapshots[number] = (normalized_head, draft, base_ref, base_name, head_name)
                      governed_heads.setdefault(normalized_head, []).append(number)
          current_targets = set(targets)
          event_targets = [number for number in event_targets if number in current_targets]
          preinvalidate_targets = [number for number in event_priority_targets if number in current_targets]
          # A dispatcher external ID is scoped to a HEAD, so the preinvalidate
          # step is the only owner for every HEAD it emits.  The all-open
          # hand-off must never create the same generation twice for a shared
          # HEAD.
          preinvalidated_heads = {target_snapshots[number][0] for number in preinvalidate_targets}
          duplicate_governed_heads = sorted(
              head for head, members in governed_heads.items() if len(members) > 1
          )
          # A priority early writer validates the complete open snapshot.  Any
          # shared HEAD namespace would make that snapshot fail before the
          # early writer can invalidate its source, even if the source itself
          # is unique. Suppress every early path: the synchronous
          # pre-invalidator owns affected shared HEADs, then the all-open
          # hand-off pendingizes every remaining distinct HEAD and stops.
          # A priority writer owns a pending + terminal mutation for every
          # target.  Keep the synchronous path below 100 mutations / 15
          # minutes; every remaining affected head is already fail-closed by
          # the dispatcher Check Run and is handed to the all-open arbiter.
          priority_targets = [] if duplicate_governed_heads else preinvalidate_targets[:40]
          # Preserve the resolver's source/claimant ordering.  Pagination can
          # place unrelated PRs first, but affected siblings must be
          # invalidated before that unrelated tail.  The early source itself
          # is owned by the singleton early writer and is intentionally kept
          # out of this all-open invalidation list.
          preserved = set(priority_targets)
          event_tail = [
              number for number in event_targets
              if number not in preserved and target_snapshots[number][0] not in preinvalidated_heads
          ]
          all_invalidation_targets = event_tail + [
              number for number in targets
              if number not in preserved and number not in set(event_tail)
              and target_snapshots[number][0] not in preinvalidated_heads
          ]
          all_invalidation_target_snapshots = [
              [number, *target_snapshots[number]]
              for number in all_invalidation_targets
          ]
          # Every Check Run generation is scoped to a head.  Split the
          # pre/all invalidators by distinct head, not by PR number: this
          # preserves uniqueness even while a malformed shared head is being
          # fail-closed.  Each 300-head chunk takes at most ~40.5 minutes at
          # the Check Run pace, safely inside one App-token lifetime.  The
          # 600-head bound is operational, not an enumeration bound: target
          # discovery must still finish and publish the default-branch output
          # so the global merge barrier can be activated before this run stops.
          def chunks_by_head(numbers):
              chunks = [[], []]
              positions = {}
              for number in numbers:
                  head = target_snapshots[number][0]
                  position = positions.get(head)
                  if position is None:
                      if len(positions) >= 600:
                          return [[], []], True
                      position = 0 if sum(1 for value in positions.values() if value == 0) < 300 else 1
                      positions[head] = position
                  chunks[position].append(number)
              return chunks, False
          pre_chunks, pre_head_cap_exceeded = chunks_by_head(preinvalidate_targets)
          all_chunks, all_head_cap_exceeded = chunks_by_head(all_invalidation_targets)
          invalidation_head_cap_exceeded = pre_head_cap_exceeded or all_head_cap_exceeded
          pre_chunk_snapshots = [
              [[number, *priority_identity_snapshots[number]] for number in chunk]
              for chunk in pre_chunks
          ]
          all_chunk_snapshots = [
              [[number, *target_snapshots[number]] for number in chunk]
              for chunk in all_chunks
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("has_targets=" + ("true" if targets else "false") + "\n")
              output.write("targets=" + json.dumps(targets) + "\n")
              output.write("target_snapshots=" + json.dumps([[number, *target_snapshots[number]] for number in targets], separators=(",", ":")) + "\n")
              output.write("event_targets=" + json.dumps(event_targets, separators=(",", ":")) + "\n")
              output.write("has_event_targets=" + ("true" if event_targets else "false") + "\n")
              output.write("has_priority_targets=" + ("true" if priority_targets else "false") + "\n")
              output.write("priority_targets=" + json.dumps(priority_targets, separators=(",", ":")) + "\n")
              output.write("preinvalidate_targets=" + json.dumps(preinvalidate_targets, separators=(",", ":")) + "\n")
              output.write("has_preinvalidate_targets=" + ("true" if preinvalidate_targets else "false") + "\n")
              output.write("invalidation_head_cap_exceeded=" + ("true" if invalidation_head_cap_exceeded else "false") + "\n")
              output.write("has_preinvalidate_chunk_1=" + ("true" if pre_chunks[0] else "false") + "\n")
              output.write("preinvalidate_chunk_1=" + json.dumps(pre_chunks[0], separators=(",", ":")) + "\n")
              output.write("preinvalidate_chunk_1_snapshots=" + json.dumps(pre_chunk_snapshots[0], separators=(",", ":")) + "\n")
              output.write("has_preinvalidate_chunk_2=" + ("true" if pre_chunks[1] else "false") + "\n")
              output.write("preinvalidate_chunk_2=" + json.dumps(pre_chunks[1], separators=(",", ":")) + "\n")
              output.write("preinvalidate_chunk_2_snapshots=" + json.dumps(pre_chunk_snapshots[1], separators=(",", ":")) + "\n")
              output.write("preinvalidated_heads=" + json.dumps(sorted(preinvalidated_heads), separators=(",", ":")) + "\n")
              output.write("preinvalidate_target_snapshots=" + json.dumps([[number, *priority_identity_snapshots[number]] for number in preinvalidate_targets], separators=(",", ":")) + "\n")
              output.write("duplicate_governed_heads=" + json.dumps(duplicate_governed_heads, separators=(",", ":")) + "\n")
              output.write("has_duplicate_governed_heads=" + ("true" if duplicate_governed_heads else "false") + "\n")
              output.write("has_all_invalidation_targets=" + ("true" if all_invalidation_targets else "false") + "\n")
              output.write("all_invalidation_targets=" + json.dumps(all_invalidation_targets, separators=(",", ":")) + "\n")
              output.write("all_invalidation_target_snapshots=" + json.dumps(all_invalidation_target_snapshots, separators=(",", ":")) + "\n")
              output.write("has_all_invalidation_chunk_1=" + ("true" if all_chunks[0] else "false") + "\n")
              output.write("all_invalidation_chunk_1=" + json.dumps(all_chunks[0], separators=(",", ":")) + "\n")
              output.write("all_invalidation_chunk_1_snapshots=" + json.dumps(all_chunk_snapshots[0], separators=(",", ":")) + "\n")
              output.write("has_all_invalidation_chunk_2=" + ("true" if all_chunks[1] else "false") + "\n")
              output.write("all_invalidation_chunk_2=" + json.dumps(all_chunks[1], separators=(",", ":")) + "\n")
              output.write("all_invalidation_chunk_2_snapshots=" + json.dumps(all_chunk_snapshots[1], separators=(",", ":")) + "\n")
              output.write("priority_target_snapshots=" + json.dumps([[number, *priority_identity_snapshots[number]] for number in priority_targets], separators=(",", ":")) + "\n")
              output.write("writer_head=" + writer_head + "\n")
              output.write("default_branch=" + branch + "\n")
          PY

      - name: Verify default-branch governance source before barrier credentials
        id: barrier-source
        if: github.run_attempt == 1
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ steps.current-targets.outputs.default_branch }}
          DEFAULT_HEAD: ${{ steps.current-targets.outputs.writer_head }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, time
          repository=os.environ["GITHUB_REPOSITORY"]; branch=os.environ.get("DEFAULT_BRANCH", ""); head=os.environ.get("DEFAULT_HEAD", ""); workflow_ref=os.environ.get("WORKFLOW_REF", ""); workflow_sha=os.environ.get("WORKFLOW_SHA", "")
          if not re.fullmatch(r"[A-Za-z0-9._/-]+",branch) or re.fullmatch(r"[0-9a-fA-F]{40}",head) is None or workflow_ref!=f"{repository}/.github/workflows/pr-governance.yml@refs/heads/{branch}" or workflow_sha.lower()!=head.lower(): raise SystemExit("Governance barrier workflow source is not the trusted default branch.")
          source_env={"GH_TOKEN":os.environ["GH_TOKEN"],"PATH":os.environ["PATH"]}
          repository_result=subprocess.run(["gh","api","--hostname","github.com",f"repos/{repository}"],capture_output=True,text=True,check=False,env=source_env, timeout=20)
          reference_result=subprocess.run(["gh","api","--hostname","github.com",f"repos/{repository}/git/ref/heads/{branch}"],capture_output=True,text=True,check=False,env=source_env, timeout=20)
          if repository_result.returncode!=0 or reference_result.returncode!=0: raise SystemExit("Unable to bind governance barrier default branch source.")
          try: current_branch=json.loads(repository_result.stdout).get("default_branch"); current_head=json.loads(reference_result.stdout).get("object",{}).get("sha")
          except json.JSONDecodeError as error: raise SystemExit("Governance barrier default branch source is not JSON.") from error
          if current_branch!=branch or not isinstance(current_head,str) or current_head.lower()!=head.lower(): raise SystemExit("Governance barrier default branch source changed.")
          result=subprocess.run(["gh","api","--hostname","github.com",f"repos/{repository}/contents/.github/workflows/pr-governance.yml?ref={head}"],capture_output=True,text=True,check=False,env=source_env, timeout=20)
          if result.returncode!=0: raise SystemExit("Unable to bind governance barrier workflow blob.")
          try: payload=json.loads(result.stdout); blob=payload.get("sha") if isinstance(payload,dict) else None
          except json.JSONDecodeError as error: raise SystemExit("Governance barrier workflow blob is not JSON.") from error
          if not isinstance(blob,str) or re.fullmatch(r"[0-9a-fA-F]{40}",blob) is None: raise SystemExit("Governance barrier workflow blob is invalid.")
          PY

      - name: Create periodic affected-head barrier marker write token
        # 初回priorityでは、context-onlyのbranch protection変更より前に
        # 固定AppのmarkerをseedしてGitHubへApp identityを束縛する。
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.current-targets.outputs.has_preinvalidate_targets == 'true' || steps.current-targets.outputs.invalidation_head_cap_exceeded == 'true') && steps.barrier-source.outcome == 'success'
        id: barrier-marker-write
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.KRR_GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.KRR_GOVERNANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write

      - name: Create periodic affected-head barrier marker read token
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.current-targets.outputs.has_preinvalidate_targets == 'true' || steps.current-targets.outputs.invalidation_head_cap_exceeded == 'true') && steps.barrier-source.outcome == 'success'
        id: barrier-marker-read
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.KRR_GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.KRR_GOVERNANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: read

      - name: Publish periodic static affected-head barrier App marker
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.current-targets.outputs.has_preinvalidate_targets == 'true' || steps.current-targets.outputs.invalidation_head_cap_exceeded == 'true') && steps.barrier-source.outcome == 'success'
        id: barrier-marker-publish
        continue-on-error: true
        env:
          CHECK_WRITE_TOKEN: ${{ steps.barrier-marker-write.outputs.token }}
          CHECK_READ_TOKEN: ${{ steps.barrier-marker-read.outputs.token }}
          DEFAULT_HEAD: ${{ steps.current-targets.outputs.writer_head }}
          DISPATCHER_RUN_ID: ${{ github.run_id }}
          CHECK_APP_ID: ${{ vars.KRR_GOVERNANCE_APP_ID }}
        run: |
          python3 - <<'PY'
