          closing = re.compile(
              r"\b(?:close(?:s|d)?|fix(?:es|ed)?|resolve(?:s|d)?)\b"
              r"(?:[ \t]*:[ \t]*|[ \t]+)"
              r"(?:#([1-9][0-9]*)\b|https://github\.com/"
              + re.escape(owner)
              + "/"
              + re.escape(repository_name)
              + r"/issues/([1-9][0-9]*)"
              + issue_url_terminator
              + r")",
              re.I,
          )
