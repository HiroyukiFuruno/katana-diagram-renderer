      - name: Fail closed after classification barrier activation
        env:
          EVENT_SOURCE_VALID: ${{ needs.preflight-workflow-run-source.outputs.valid }}
        run: |
          python3 - <<'PY'
          import os

          if os.environ.get("EVENT_SOURCE_VALID") != "true":
              raise SystemExit("Workflow_run governance source classification is invalid; barrier remains active.")
          PY

  resolve_event:
    name: Resolve relevant governance event
    needs: establish-resolver-failure-barrier
    if: needs.establish-resolver-failure-barrier.outputs.reconcile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Keep target resolution in the same generation as its barrier. A
    # non-priority CI/release source remains serialized without canceling a
    # paced reconciliation; priority sources retain preemption.
    concurrency:
      group: pr-governance-dispatcher-${{ github.repository_id }}
      cancel-in-progress: ${{ needs.establish-resolver-failure-barrier.outputs.priority == 'true' }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      reconcile: ${{ steps.targets.outputs.reconcile }}
      event_targets: ${{ steps.targets.outputs.event_targets }}
      priority_targets: ${{ steps.targets.outputs.priority_targets }}
      root_deadline_epoch: ${{ needs.establish-resolver-failure-barrier.outputs.root_deadline_epoch }}
    steps:
      - name: Resolve current open pull requests from the trusted default branch
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_PULL_REQUEST_URL: ${{ github.event.issue.pull_request.url }}
          DEFAULT_BRANCH: ${{ needs.establish-resolver-failure-barrier.outputs.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_PREVIOUS_BODY: ${{ github.event.changes.body.from }}
          PR_PREVIOUS_BASE_REF: ${{ github.event.changes.base.ref.from }}
          PR_ACTION: ${{ github.event.action }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          repository = os.environ["GITHUB_REPOSITORY"]
          event_name = os.environ["EVENT_NAME"]
          workflow_run_out_of_scope = False
          default_branch = os.environ.get("DEFAULT_BRANCH", "")
          if re.fullmatch(r"[A-Za-z0-9._/-]+", default_branch) is None or re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository) is None:
              raise SystemExit("Repository default branch is invalid.")
