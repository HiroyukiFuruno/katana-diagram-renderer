          source_created_at = source_run.get("created_at") if isinstance(source_run, dict) else None
          if not isinstance(source_run, dict) or source_run.get("id") != int(dispatcher_run_id) or source_run.get("name") != "PR governance dispatcher" or source_run.get("event") not in {"pull_request_target", "issue_comment", "issues", "schedule", "workflow_dispatch", "workflow_run"} or source_run.get("head_branch") != branch or source_run.get("head_sha") != writer_head or not isinstance(source_repository, dict) or source_repository.get("full_name") != repository or type(source_run.get("run_number")) is not int or source_run["run_number"] < 1 or type(source_run.get("run_attempt")) is not int or source_run["run_attempt"] != 1 or source_run.get("status") not in {"requested", "queued", "in_progress"} or not isinstance(source_created_at, str) or re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z", source_created_at) is None:
              raise SystemExit("Governance dispatcher source identity changed before terminal dispatch.")
          def pull_page(page_number):
              arguments = ["gh", "api", f"repos/{repository}/pulls?state=open&per_page=100&page={page_number}"]
              if page_number == 6: arguments.insert(2, "--include")
              listed = subprocess.run(arguments, capture_output=True, text=True, check=False, timeout=20)
              if listed.returncode != 0:
                  raise SystemExit("Unable to revalidate the all-open governance snapshot.")
              try:
                  raw = listed.stdout
