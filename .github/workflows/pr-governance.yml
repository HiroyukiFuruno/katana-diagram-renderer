          if matches:
              raise SystemExit("Resolver-failure barrier has an unexpected App source.")
          expected=copy.deepcopy(before); expected_required=expected["required_status_checks"]
          expected_required["checks"]=[{"context":context,"app_id":app_id} if name==context else {"context":name,"app_id":owner} for name,owner in before_records]
          if not matches:
