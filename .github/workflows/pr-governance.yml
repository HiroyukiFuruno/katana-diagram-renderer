        with:
          app-id: ${{ vars.KRR_GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.KRR_GOVERNANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
          permission-checks: read
          permission-contents: read
          permission-pull-requests: read

      - name: Record first terminal segment dispatch start
        if: steps.current-targets.outputs.has_targets == 'true' && steps.current-targets.outputs.has_duplicate_governed_heads != 'true'
        id: terminal-window-1
        env:
          ROOT_DEADLINE_EPOCH: ${{ needs.resolve_event.outputs.root_deadline_epoch }}
        run: |
          python3 - <<'PY'
          import math, os, re, time
          # Ceiling the real dispatch instant makes the next start conservative
          # by up to one second, never earlier than the 3610s contract.
          started_at = math.ceil(time.time())
          root_deadline = os.environ.get("ROOT_DEADLINE_EPOCH", "")
