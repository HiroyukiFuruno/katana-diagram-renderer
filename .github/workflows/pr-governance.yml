          if re.fullmatch(r"[1-9][0-9]*", started) is None:
              raise SystemExit("Terminal segment start is invalid.")
          deadline = int(started) + 3750
          registered = False
          for _ in range(60):
              if time.time() >= deadline:
                  break
              candidates = []
              for run in runs():
                  identifier = run.get("id")
                  run_repository = run.get("repository")
                  if identifier in before_ids:
                      continue
                  # 同じworkflowの別dispatchはsource表示が異なるため相関対象にしない。
                  if run.get("display_title") != expected_title:
                      continue
                  if (
                      type(identifier) is not int or identifier < 1
                      or run.get("name") != "PR governance status writer"
                      or run.get("display_title") != expected_title
                      or not path_matches(run.get("path"))
                      or run.get("event") != "workflow_dispatch"
