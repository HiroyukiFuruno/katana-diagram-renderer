          WRITER_PRE_CHECK_MANIFEST_1: ${{ steps.preinvalidate-1.outputs.check_manifest || '[]' }}
          WRITER_PRE_CHECK_MANIFEST_2: ${{ steps.preinvalidate-2.outputs.check_manifest || '[]' }}
          WRITER_TAIL_CHECK_MANIFEST_1: ${{ steps.invalidate-all-1.outputs.check_manifest || '[]' }}
          WRITER_TAIL_CHECK_MANIFEST_2: ${{ steps.invalidate-all-2.outputs.check_manifest || '[]' }}
