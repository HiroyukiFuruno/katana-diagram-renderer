              preserved = json.loads(raw_preserved)
              pre_targets = json.loads(raw_pre_targets)
              pre_manifest_1 = json.loads(raw_pre_manifest_1)
              pre_manifest_2 = json.loads(raw_pre_manifest_2)
              tail_manifest_1 = json.loads(raw_tail_manifest_1)
              tail_manifest_2 = json.loads(raw_tail_manifest_2)
