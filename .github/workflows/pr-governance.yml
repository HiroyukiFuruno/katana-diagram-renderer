          def path_matches(value):
              if value == workflow_path:
                  return True
              if not isinstance(value, str) or not value.startswith(workflow_path + "@"):
                  return False
              ref = value[len(workflow_path) + 1:]
              return re.fullmatch(r"[A-Za-z0-9._/-]+", ref) is not None and ref not in {".", ".."} and not ref.startswith("/") and "//" not in ref and all(part not in {"", ".", ".."} for part in ref.split("/"))
          writer_runs_query = urlencode({"event": "workflow_dispatch", "branch": branch, "head_sha": writer_head, "created": f">={source_created_at}", "per_page": "100"})
          def runs():
              listed = subprocess.run(["gh", "api", f"repos/{repository}/actions/workflows/pr-governance-status-writer.yml/runs?{writer_runs_query}"], capture_output=True, text=True, check=False, timeout=20)
              if listed.returncode != 0:
                  raise SystemExit("Unable to enumerate governance writer runs.")
              try:
                  response = json.loads(listed.stdout)
              except json.JSONDecodeError as error:
                  raise SystemExit("Governance writer runs are not JSON.") from error
              total = response.get("total_count") if isinstance(response, dict) else None
              flattened = response.get("workflow_runs") if isinstance(response, dict) else None
              if type(total) is not int or total < 0 or total > 100 or not isinstance(flattened, list) or len(flattened) != total:
                  raise SystemExit("Governance writer runs are invalid.")
