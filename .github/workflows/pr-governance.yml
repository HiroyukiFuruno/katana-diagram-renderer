                  base = pull.get("base") if isinstance(pull, dict) else None
                  head = pull.get("head") if isinstance(pull, dict) else None
                  base_repo = base.get("repo") if isinstance(base, dict) else None
                  head_repo = head.get("repo") if isinstance(head, dict) and "repo" in head else None
                  head_sha = head.get("sha") if isinstance(head, dict) else None
                  draft = pull.get("draft") if isinstance(pull, dict) else None
                  if type(number) is not int or number < 1 or pull.get("state") != "open" or not isinstance(base_repo, dict) or not isinstance(head, dict) or "repo" not in head:
