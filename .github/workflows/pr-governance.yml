              or any(json.dumps(value, separators=(",", ":")) != raw for value, raw in ((pre_manifest_1, raw_pre_manifest_1), (pre_manifest_2, raw_pre_manifest_2), (tail_manifest_1, raw_tail_manifest_1), (tail_manifest_2, raw_tail_manifest_2), (preserved_manifest, raw_preserved_manifest)))
              or any(not isinstance(item, list) or len(item) != 2 or type(item[0]) is not int or item[0] < 1 or type(item[1]) is not int or item[1] < 1 for item in pre_manifest_1 + pre_manifest_2 + tail_manifest_1 + tail_manifest_2 + preserved_manifest)
              or [item[0] for item in preserved_manifest] != preserved
              or not isinstance(carry_targets_1, list) or not isinstance(carry_targets_2, list)
              or any(type(number) is not int or number < 1 for number in carry_targets_1 + carry_targets_2)
              or len(set(carry_targets_1)) != len(carry_targets_1) or len(set(carry_targets_2)) != len(carry_targets_2)
              or set(carry_targets_1) & set(carry_targets_2)
