          workflow_path = ".github/workflows/pr-governance-status-writer.yml"
          scope = os.environ.get("WRITER_SCOPE", "")
          raw_targets = os.environ.get("WRITER_TARGETS", "")
          raw_all_targets = os.environ.get("WRITER_ALL_OPEN_TARGETS", "")
          raw_all_snapshots = os.environ.get("WRITER_ALL_OPEN_SNAPSHOTS", "")
          raw_preserved = os.environ.get("WRITER_PRESERVED_TARGETS", "")
          preserved_writer_run_id = os.environ.get("PRESERVED_WRITER_RUN_ID", "")
          raw_pre_targets = os.environ.get("WRITER_PREINVALIDATE_TARGETS", "")
          raw_pre_manifest_1 = os.environ.get("WRITER_PRE_CHECK_MANIFEST_1", "")
          raw_pre_manifest_2 = os.environ.get("WRITER_PRE_CHECK_MANIFEST_2", "")
          raw_tail_manifest_1 = os.environ.get("WRITER_TAIL_CHECK_MANIFEST_1", "")
          raw_tail_manifest_2 = os.environ.get("WRITER_TAIL_CHECK_MANIFEST_2", "")
          raw_preserved_manifest = os.environ.get("WRITER_PRESERVED_CHECK_MANIFEST", "")
          raw_carry_1 = os.environ.get("WRITER_CARRY_TARGET_NUMBERS_1", "")
          raw_carry_2 = os.environ.get("WRITER_CARRY_TARGET_NUMBERS_2", "")
