        # setup失敗はcontinue-on-errorでここまでdeferする。priority対象を
        # pendingへ置換した後、marker/App束縛/barrierが完全成功した場合だけ
        # writerへhand-offする。
        if: always() && steps.current-targets.outputs.has_preinvalidate_targets == 'true'
        env:
