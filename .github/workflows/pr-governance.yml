          WRITER_PRESERVED_TARGETS: ${{ steps.current-targets.outputs.priority_targets }}
          PRESERVED_WRITER_RUN_ID: ${{ steps.dispatch-early.outputs.writer_run_id || '0' }}
          WRITER_CARRY_TARGET_NUMBERS_1: ${{ steps.invalidate-all-1.outputs.carry_target_numbers || '[]' }}
          WRITER_CARRY_TARGET_NUMBERS_2: ${{ steps.invalidate-all-2.outputs.carry_target_numbers || '[]' }}
