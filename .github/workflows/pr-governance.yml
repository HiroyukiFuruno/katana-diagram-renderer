              if not isinstance(run,dict) or not re.fullmatch(r"[A-Za-z0-9-]+\[bot\]",bot) or run.get("id")!=int(identifier) or run.get("name")!="PR governance status writer" or run.get("display_title")!=expected or not (path_value==path or isinstance(path_value,str) and path_value.startswith(path+"@") and re.fullmatch(r"[A-Za-z0-9._/-]+",path_value[len(path)+1:]) is not None) or run.get("event")!="workflow_dispatch" or not isinstance(run_repo,dict) or run_repo.get("full_name")!=repository or not isinstance(actor,dict) or actor.get("login")!=bot or actor.get("type")!="Bot" or not isinstance(triggering_actor,dict) or triggering_actor.get("login")!=bot or triggering_actor.get("type")!="Bot" or run.get("head_branch")!=branch or run.get("head_sha")!=head or run.get("status") not in {"requested","queued","pending","waiting","in_progress","completed"} or type(run.get("run_number")) is not int or run["run_number"]<1 or type(run.get("run_attempt")) is not int or run["run_attempt"]!=1: raise SystemExit("Governance terminal writer identity is invalid.")
              if run.get("status") == "completed":
