          BARRIER_ACTIVE: ${{ steps.affected-barrier.outputs.active }}
          PREINVALIDATE_CHUNK_1_REQUIRED: ${{ steps.current-targets.outputs.has_preinvalidate_chunk_1 }}
          PREINVALIDATE_CHUNK_1_OUTCOME: ${{ steps.preinvalidate-1.outcome }}
          PREINVALIDATE_CHUNK_2_REQUIRED: ${{ steps.current-targets.outputs.has_preinvalidate_chunk_2 }}
          PREINVALIDATE_CHUNK_2_OUTCOME: ${{ steps.preinvalidate-2.outcome }}
        run: |
          python3 - <<'PY'
          import os

          required = (
              "MARKER_WRITE_OUTCOME",
              "MARKER_READ_OUTCOME",
              "MARKER_PUBLISH_OUTCOME",
              "BARRIER_TOKEN_OUTCOME",
              "BARRIER_ACTIVATE_OUTCOME",
