          if len(before_ids) != len(before):
              raise SystemExit("Governance writer run identity is invalid.")
          result = subprocess.run(["gh", "api", "--method", "POST", f"repos/{repository}/actions/workflows/pr-governance-status-writer.yml/dispatches", "-f", f"ref={branch}", "-f", f"inputs[dispatcher_run_id]={dispatcher_run_id}", "-f", f"inputs[scope]={scope}", "-f", f"inputs[target_numbers]={raw_targets}", "-f", f"inputs[preserved_target_numbers]={raw_preserved}", "-f", f"inputs[preserved_writer_run_id]={preserved_writer_run_id}", "-f", f"inputs[check_manifest]={raw_manifest}", "-f", f"inputs[terminal_batch_numbers]={json.dumps(batches[0],separators=(',', ':'))}", "-f", "inputs[continuation_index]=1", "-f", f"inputs[terminal_order_numbers]={json.dumps(terminal_order,separators=(',', ':'))}", "-f", "inputs[completed_writer_run_ids]=[]", "-f", f"inputs[terminal_deadline_epoch]={int(os.environ['TERMINAL_SEGMENT_STARTED_AT']) + 3750}"], capture_output=True, text=True, check=False, timeout=20)
          if result.returncode != 0:
              raise SystemExit("Unable to dispatch governance arbiter.")
