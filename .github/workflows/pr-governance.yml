              raise SystemExit("Priority barrier setup did not complete successfully.")
          if os.environ.get("BARRIER_ACTIVE") != "true":
              raise SystemExit("Priority affected-head barrier is not active.")
          for index in ("1", "2"):
              if os.environ.get(f"PREINVALIDATE_CHUNK_{index}_REQUIRED") == "true" and os.environ.get(f"PREINVALIDATE_CHUNK_{index}_OUTCOME") != "success":
                  raise SystemExit("Priority invalidation did not complete successfully.")
          PY

      - name: Hold global merge barrier for an oversized governed snapshot
        # Never abort current-target discovery before the default-branch source
        # can install this global required context.  A partial 600-head
        # invalidation would leave an unmarked head with an older success, so
        # leave the barrier active and require a later complete reconciliation.
        if: always() && steps.current-targets.outputs.invalidation_head_cap_exceeded == 'true'
        env:
          BARRIER_SOURCE_OUTCOME: ${{ steps.barrier-source.outcome }}
          BARRIER_TOKEN_OUTCOME: ${{ steps.barrier-protection-activate.outcome }}
          BARRIER_ACTIVATE_OUTCOME: ${{ steps.affected-barrier.outcome }}
          BARRIER_ACTIVE: ${{ steps.affected-barrier.outputs.active }}
        run: |
          python3 - <<'PY'
          import os

          if os.environ.get("BARRIER_SOURCE_OUTCOME") != "success" or os.environ.get("BARRIER_TOKEN_OUTCOME") != "success" or os.environ.get("BARRIER_ACTIVATE_OUTCOME") != "success" or os.environ.get("BARRIER_ACTIVE") != "true":
              raise SystemExit("Governance invalidation bound exceeded before the affected-head barrier was active.")
          raise SystemExit("Governance invalidation head cap exceeded; affected-head barrier remains active until complete reconciliation.")
