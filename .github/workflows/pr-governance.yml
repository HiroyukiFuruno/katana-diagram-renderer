name: PR governance dispatcher

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  issue_comment:
    types: [created, edited, deleted]
  issues:
    types: [opened, edited, deleted, transferred, pinned, unpinned, closed, reopened, assigned, unassigned, labeled, unlabeled, locked, unlocked, milestoned, demilestoned, typed, untyped, field_added, field_removed]
  schedule:
    # The single arbiter removes the former 256-target matrix/rotation.  A
    # reconciliation run reads every open PR page without emitting a second
    # synchronous pending status for every unchanged PR.
    - cron: '17 */6 * * *'
  workflow_run:
    workflows: [PR governance review sensor, CI, release-preflight]
    types: [requested, in_progress, completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  resolve_event:
    name: Resolve relevant governance event
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      reconcile: ${{ steps.targets.outputs.reconcile }}
      event_targets: ${{ steps.targets.outputs.event_targets }}
      priority_targets: ${{ steps.targets.outputs.priority_targets }}
    steps:
      - name: Resolve current open pull requests from the trusted default branch
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_PULL_REQUEST_URL: ${{ github.event.issue.pull_request.url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_PREVIOUS_BODY: ${{ github.event.changes.body.from }}
          PR_ACTION: ${{ github.event.action }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          repository = os.environ["GITHUB_REPOSITORY"]
          event_name = os.environ["EVENT_NAME"]
          default_branch = os.environ.get("DEFAULT_BRANCH", "")
          if re.fullmatch(r"[A-Za-z0-9._/-]+", default_branch) is None:
              raise SystemExit("Repository default branch is invalid.")
          def workflow_path_matches(value, expected):
              if value == expected:
                  return True
              if not isinstance(value, str) or not value.startswith(expected + "@"):
                  return False
              ref = value[len(expected) + 1:]
              return (
                  re.fullmatch(r"[A-Za-z0-9._/-]+", ref) is not None
                  and ref not in {".", ".."} and not ref.startswith("/")
                  and "//" not in ref
                  and all(part not in {"", ".", ".."} for part in ref.split("/"))
              )
          if event_name == "workflow_run":
              run_id = os.environ.get("WORKFLOW_RUN_ID", "")
              if re.fullmatch(r"[1-9][0-9]*", run_id) is None:
                  raise SystemExit("Trusted workflow_run id is invalid.")
              result = subprocess.run(
                  ["gh", "api", f"repos/{repository}/actions/runs/{run_id}"],
                  capture_output=True, text=True, check=False,
              )
              if result.returncode != 0:
                  raise SystemExit("Unable to load trusted workflow_run.")
              try:
                  run = json.loads(result.stdout)
              except json.JSONDecodeError as error:
                  raise SystemExit("Trusted workflow_run is not JSON.") from error
              expected = {
                  "PR governance review sensor": (
                      ".github/workflows/pr-governance-review-events.yml",
                      {"pull_request", "pull_request_review", "pull_request_review_comment"},
                  ),
                  "CI": (".github/workflows/test-and-build.yml", {"pull_request"}),
                  "release-preflight": (".github/workflows/release-preflight.yml", {"pull_request"}),
              }
              name = run.get("name") if isinstance(run, dict) else None
              pulls = run.get("pull_requests") if isinstance(run, dict) else None
              source = pulls[0] if isinstance(pulls, list) and len(pulls) == 1 and isinstance(pulls[0], dict) else None
              base = source.get("base") if isinstance(source, dict) else None
              head = source.get("head") if isinstance(source, dict) else None
              run_repository = run.get("repository") if isinstance(run, dict) else None
              if (
                  not isinstance(run, dict) or name not in expected
                  or not workflow_path_matches(run.get("path"), expected[name][0]) or run.get("event") not in expected[name][1]
                  or run.get("status") not in {"requested", "queued", "waiting", "in_progress", "completed"}
                  or not isinstance(run_repository, dict) or run_repository.get("full_name") != repository
                  or type(run.get("id")) is not int or type(run.get("run_number")) is not int
                  or type(run.get("run_attempt")) is not int or not isinstance(source, dict)
                  or type(source.get("number")) is not int or not isinstance(base, dict) or not isinstance(head, dict)
                  or not isinstance(base.get("sha"), str) or not isinstance(head.get("sha"), str)
                  or base.get("ref") != default_branch
                  or not re.fullmatch(r"[0-9a-fA-F]{40}", base["sha"])
                  or run.get("head_sha") != head["sha"]
                  or not isinstance(base.get("repo"), dict) or not isinstance(head.get("repo"), dict)
                  or base["repo"].get("full_name") != repository or head["repo"].get("full_name") != repository
              ):
                  raise SystemExit("workflow_run is not a trusted governance source.")
              # PRs may edit a workflow file. The run is a sensor only when
              # its exact workflow blob is identical to the current base.
              for ref in (base["sha"], head["sha"]):
                  blob = subprocess.run(
                      ["gh", "api", f"repos/{repository}/contents/{expected[name][0]}?ref={ref}"],
                      capture_output=True, text=True, check=False,
                  )
                  if blob.returncode != 0:
                      raise SystemExit("Unable to bind workflow_run to its base workflow blob.")
                  try:
                      payload = json.loads(blob.stdout)
                      digest = payload.get("sha") if isinstance(payload, dict) else None
                  except json.JSONDecodeError as error:
                      raise SystemExit("workflow_run workflow blob is not JSON.") from error
                  if not isinstance(digest, str) or not re.fullmatch(r"[0-9a-fA-F]{40}", digest):
                      raise SystemExit("workflow_run workflow blob is invalid.")
                  if ref == base["sha"]:
                      base_digest = digest
                  elif digest != base_digest:
                      raise SystemExit("workflow_run workflow differs from its trusted base.")
          result = subprocess.run(
              ["gh", "api", "--paginate", "--slurp", f"repos/{repository}/pulls?state=open&per_page=100"],
              capture_output=True, text=True, check=False,
          )
          if result.returncode != 0:
              raise SystemExit("Unable to enumerate open pull requests.")
          try:
              pages = json.loads(result.stdout)
          except json.JSONDecodeError as error:
              raise SystemExit("Open pull request response is not JSON.") from error
          if not isinstance(pages, list) or not all(isinstance(page, list) for page in pages):
              raise SystemExit("Open pull request response is invalid.")
          # Validate all API records before narrowing to local/default-base
          # governance targets.  Foreign PRs cannot claim local Issues, but a
          # duplicate foreign record is still an invalid paginated response.
          seen_all: set[int] = set()
          numbers: set[int] = set()
          bodies: dict[int, str] = {}
          for page in pages:
              for pull in page:
                  number = pull.get("number") if isinstance(pull, dict) else None
                  if (
                      type(number) is not int
                      or number < 1
                      or number in seen_all
                      or pull.get("state") != "open"
                  ):
                      raise SystemExit("Open pull request response is invalid.")
                  seen_all.add(number)
                  body = pull.get("body")
                  if body is not None and not isinstance(body, str):
                      raise SystemExit("Open pull request body is invalid.")
                  base = pull.get("base")
                  head = pull.get("head")
                  base_repository = base.get("repo") if isinstance(base, dict) else None
                  head_repository = head.get("repo") if isinstance(head, dict) else None
                  if not isinstance(base_repository, dict) or not isinstance(head_repository, dict):
                      raise SystemExit("Open pull request repository binding is invalid.")
                  if (
                      base_repository.get("full_name") != repository
                      or head_repository.get("full_name") != repository
                      or base.get("ref") != default_branch
                  ):
                      continue
                  numbers.add(number)
                  bodies[number] = body or ""
          owner, repository_name = repository.split("/", 1)
          closing = re.compile(
              r"\b(?:close(?:s|d)?|fix(?:es|ed)?|resolve(?:s|d)?)\b\s+"
              r"(?:#|https://github\.com/" + re.escape(owner) + "/" + re.escape(repository_name) + r"/issues/)([1-9][0-9]*)\b",
              re.I,
          )
          def referenced(issue: int) -> set[int]:
              text = str(issue)
              return {number for number, body in bodies.items() if text in set(closing.findall(body))}
          source_number_value: int | None = None
          if event_name == "schedule":
              affected = numbers
          elif event_name == "workflow_run":
              source_number = source.get("number")
              source_number_value = source_number
              affected = {source_number} if source_number in numbers else set()
              source_issues = set(closing.findall(bodies.get(source_number, "")))
              for source_issue in source_issues:
                  affected |= referenced(int(source_issue))
          elif event_name == "pull_request_target":
              source_number = os.environ.get("PR_NUMBER", "")
              source_head = os.environ.get("PR_HEAD_SHA", "")
              source_base = os.environ.get("PR_BASE_SHA", "")
              if re.fullmatch(r"[1-9][0-9]*", source_number) is None or re.fullmatch(r"[0-9a-fA-F]{40}", source_head) is None or re.fullmatch(r"[0-9a-fA-F]{40}", source_base) is None:
                  raise SystemExit("pull_request_target source is invalid.")
              source_number_value = int(source_number)
              source_payload = subprocess.run(["gh", "api", f"repos/{repository}/pulls/{source_number_value}"], capture_output=True, text=True, check=False)
              if source_payload.returncode != 0:
                  raise SystemExit("Unable to bind pull_request_target source.")
              try: current_source = json.loads(source_payload.stdout)
              except json.JSONDecodeError as error: raise SystemExit("pull_request_target source is not JSON.") from error
              current_base = current_source.get("base") if isinstance(current_source, dict) else None
              current_head = current_source.get("head") if isinstance(current_source, dict) else None
              current_base_repository = current_base.get("repo") if isinstance(current_base, dict) else None
              current_head_repository = current_head.get("repo") if isinstance(current_head, dict) else None
              expected_state = "closed" if os.environ.get("PR_ACTION") == "closed" else "open"
              if not isinstance(current_source, dict) or current_source.get("number") != source_number_value or current_source.get("state") != expected_state or not isinstance(current_base, dict) or not isinstance(current_head, dict) or current_base.get("sha") != source_base or current_head.get("sha") != source_head or not isinstance(current_base_repository, dict) or not isinstance(current_head_repository, dict):
                  raise SystemExit("pull_request_target source changed before revalidation.")
              if current_base.get("ref") != default_branch or current_base_repository.get("full_name") != repository or current_head_repository.get("full_name") != repository:
                  # A public fork/non-default PR is outside the App's
                  # governance domain and must not invalidate local claimants.
                  affected = set()
              else:
                  affected = {source_number_value} if source_number_value in numbers else set()
                  for body in (os.environ.get("PR_BODY", ""), os.environ.get("PR_PREVIOUS_BODY", "")):
                      if not isinstance(body, str):
                          raise SystemExit("pull_request_target body is invalid.")
                      for source_issue in set(closing.findall(body)):
                          affected |= referenced(int(source_issue))
          else:
              issue_number = os.environ.get("ISSUE_NUMBER", "")
              if re.fullmatch(r"[1-9][0-9]*", issue_number) is None:
                  raise SystemExit("Issue event number is invalid.")
              issue = int(issue_number)
              affected = referenced(issue)
              if event_name == "issue_comment" and os.environ.get("ISSUE_PULL_REQUEST_URL", "") and issue in numbers:
                  affected.add(issue)
                  source_number_value = issue
          ordered_targets = (
              ([source_number_value] if source_number_value in affected else [])
              + sorted(affected - ({source_number_value} if source_number_value in affected else set()))
          )
          # Only the current event's source PR may receive the early writer.
          # Related claimants converge in the all-open pass; treating the
          # source-first ordering as a priority set would still serially
          # invalidate every sibling before the review-sensor deadline.
          priority_targets = [source_number_value] if source_number_value in affected and source_number_value in numbers else []
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("reconcile=" + ("true" if affected else "false") + "\n")
              output.write("event_targets=" + json.dumps(ordered_targets) + "\n")
              output.write("priority_targets=" + json.dumps(priority_targets) + "\n")
          PY

  reconcile-all-open:
    name: Reconcile all current governance pull requests
    needs: resolve_event
    if: needs.resolve_event.outputs.reconcile == 'true'
    environment: pr-governance
    runs-on: ubuntu-latest
    # 関連eventは置換せず、待機後のreconcilerが全current local/default-base PRを再列挙する。
    concurrency:
      group: pr-governance-dispatcher-${{ github.repository_id }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Re-enumerate every current local governance pull request
        id: current-targets
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TARGETS: ${{ needs.resolve_event.outputs.event_targets }}
          EVENT_PRIORITY_TARGETS: ${{ needs.resolve_event.outputs.priority_targets }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          repository = os.environ["GITHUB_REPOSITORY"]
          try:
              event_targets = json.loads(os.environ.get("EVENT_TARGETS", ""))
              event_priority_targets = json.loads(os.environ.get("EVENT_PRIORITY_TARGETS", ""))
          except json.JSONDecodeError as error:
              raise SystemExit("Event target boundary is invalid.") from error
          if not isinstance(event_targets, list) or any(type(number) is not int or number < 1 for number in event_targets) or len(set(event_targets)) != len(event_targets):
              raise SystemExit("Event target boundary is invalid.")
          if not isinstance(event_priority_targets, list) or len(event_priority_targets) > 1 or any(type(number) is not int or number < 1 for number in event_priority_targets) or any(number not in event_targets for number in event_priority_targets):
              raise SystemExit("Event priority target boundary is invalid.")
          repo_result = subprocess.run(["gh", "api", f"repos/{repository}"], capture_output=True, text=True, check=False)
          if repo_result.returncode != 0:
              raise SystemExit("Unable to load repository default branch.")
          try:
              repo = json.loads(repo_result.stdout)
              branch = repo.get("default_branch") if isinstance(repo, dict) else None
          except json.JSONDecodeError as error:
              raise SystemExit("Repository response is not JSON.") from error
          if not isinstance(branch, str) or re.fullmatch(r"[A-Za-z0-9._/-]+", branch) is None:
              raise SystemExit("Repository default branch is invalid.")
          head_result = subprocess.run(["gh", "api", f"repos/{repository}/git/ref/heads/{branch}"], capture_output=True, text=True, check=False)
          if head_result.returncode != 0:
              raise SystemExit("Unable to load repository default head.")
          try:
              writer_head = json.loads(head_result.stdout).get("object", {}).get("sha")
          except json.JSONDecodeError as error:
              raise SystemExit("Repository default head is not JSON.") from error
          if not isinstance(writer_head, str) or re.fullmatch(r"[0-9a-fA-F]{40}", writer_head) is None:
              raise SystemExit("Repository default head is invalid.")
          result = subprocess.run(["gh", "api", "--paginate", "--slurp", f"repos/{repository}/pulls?state=open&per_page=100"], capture_output=True, text=True, check=False)
          if result.returncode != 0:
              raise SystemExit("Unable to enumerate current open pull requests.")
          try:
              pages = json.loads(result.stdout)
          except json.JSONDecodeError as error:
              raise SystemExit("Current open pull request response is not JSON.") from error
          if not isinstance(pages, list) or not all(isinstance(page, list) for page in pages):
              raise SystemExit("Current open pull request response is invalid.")
          seen: set[int] = set()
          targets: list[int] = []
          for page in pages:
              for pull in page:
                  number = pull.get("number") if isinstance(pull, dict) else None
                  if type(number) is not int or number < 1 or number in seen or pull.get("state") != "open":
                      raise SystemExit("Current open pull request response is invalid.")
                  seen.add(number)
                  body = pull.get("body")
                  if body is not None and not isinstance(body, str):
                      raise SystemExit("Current open pull request body is invalid.")
                  base = pull.get("base") if isinstance(pull, dict) else None
                  head = pull.get("head") if isinstance(pull, dict) else None
                  base_repository = base.get("repo") if isinstance(base, dict) else None
                  head_repository = head.get("repo") if isinstance(head, dict) else None
                  if not isinstance(base_repository, dict) or not isinstance(head_repository, dict):
                      raise SystemExit("Current open pull request repository binding is invalid.")
                  if base_repository.get("full_name") == repository and head_repository.get("full_name") == repository and base.get("ref") == branch:
                      targets.append(number)
          priority_targets = [number for number in event_priority_targets if number in set(targets)]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("has_targets=" + ("true" if targets else "false") + "\n")
              output.write("targets=" + json.dumps(targets) + "\n")
              output.write("has_priority_targets=" + ("true" if priority_targets else "false") + "\n")
              output.write("priority_targets=" + json.dumps(priority_targets) + "\n")
              output.write("writer_head=" + writer_head + "\n")
              output.write("default_branch=" + branch + "\n")
          PY

      - name: Create dispatcher App token
        if: steps.current-targets.outputs.has_targets == 'true'
        id: dispatcher-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.KRR_GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.KRR_GOVERNANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write

      - name: Create synchronous Check Run invalidator App token
        if: steps.current-targets.outputs.has_targets == 'true'
        id: invalidator-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.KRR_GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.KRR_GOVERNANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write

      - name: Drain authoritative writer before invalidation
        if: steps.current-targets.outputs.has_targets == 'true'
        env:
          GH_TOKEN: ${{ steps.dispatcher-token.outputs.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys, time

          repository = os.environ["GITHUB_REPOSITORY"]
          writer_path = ".github/workflows/pr-governance-status-writer.yml"
          active = {"requested", "queued", "pending", "waiting", "in_progress"}

          def request(arguments):
              result = subprocess.run(["gh", "api", *arguments], capture_output=True, text=True, check=False)
              if result.returncode != 0:
                  raise SystemExit("Unable to drain a prior governance writer.")
              return result.stdout

          def payload(arguments):
              try:
                  return json.loads(request(arguments))
              except json.JSONDecodeError as error:
                  raise SystemExit("Governance writer API response is not JSON.") from error

          def path_matches(value):
              if value == writer_path:
                  return True
              if not isinstance(value, str) or not value.startswith(writer_path + "@"):
                  return False
              ref = value[len(writer_path) + 1:]
              return re.fullmatch(r"[A-Za-z0-9._/-]+", ref) is not None and ref not in {".", ".."} and not ref.startswith("/") and "//" not in ref and all(part not in {"", ".", ".."} for part in ref.split("/"))

          repository_value = payload([f"repos/{repository}"])
          branch = repository_value.get("default_branch") if isinstance(repository_value, dict) else None
          if not isinstance(branch, str) or re.fullmatch(r"[A-Za-z0-9._/-]+", branch) is None:
              raise SystemExit("Repository default branch is invalid.")
          reference = payload([f"repos/{repository}/git/ref/heads/{branch}"])
          default_head = reference.get("object", {}).get("sha") if isinstance(reference, dict) and isinstance(reference.get("object"), dict) else None
          if not isinstance(default_head, str) or re.fullmatch(r"[0-9a-fA-F]{40}", default_head) is None:
              raise SystemExit("Repository default head is invalid.")
          workflow = payload([f"repos/{repository}/actions/workflows/{writer_path.rsplit('/', 1)[-1]}"])
          workflow_id = workflow.get("id") if isinstance(workflow, dict) else None
          if type(workflow_id) is not int or workflow_id < 1:
              raise SystemExit("Governance writer workflow ID is invalid.")
          listed = payload(["--paginate", "--slurp", f"repos/{repository}/actions/workflows/{workflow_id}/runs?per_page=100"])
          if not isinstance(listed, list) or not all(isinstance(page, dict) and isinstance(page.get("workflow_runs"), list) for page in listed):
              raise SystemExit("Governance writer run list is invalid.")

          def validate(run):
              run_repository = run.get("repository") if isinstance(run, dict) else None
              if not (
                  isinstance(run, dict) and type(run.get("id")) is int and run["id"] > 0
                  and run.get("name") == "PR governance status writer" and path_matches(run.get("path"))
                  and run.get("event") == "workflow_dispatch" and isinstance(run.get("head_sha"), str)
                  and re.fullmatch(r"[0-9a-fA-F]{40}", run["head_sha"]) is not None
                  and run.get("workflow_id") == workflow_id and isinstance(run_repository, dict)
                  and run_repository.get("full_name") == repository
                  and type(run.get("run_number")) is int and run["run_number"] > 0
                  and type(run.get("run_attempt")) is int and run["run_attempt"] > 0
                  and isinstance(run.get("status"), str)
              ):
                  raise SystemExit("Governance writer run identity is invalid.")

          targets = []
          for page in listed:
              for run in page["workflow_runs"]:
                  if not isinstance(run, dict):
                      raise SystemExit("Governance writer run is invalid.")
                  if run.get("status") in active:
                      validate(run)
                      targets.append(run["id"])
          if len(set(targets)) != len(targets):
              raise SystemExit("Governance writer run list is duplicated.")
          for identifier in targets:
              cancel = subprocess.run(["gh", "api", "--method", "POST", f"repos/{repository}/actions/runs/{identifier}/cancel"], capture_output=True, text=True, check=False)
              if cancel.returncode == 0:
                  continue
              # 一覧取得からcancelの間に完了した競合は、再読でterminalを
              # 確認できた場合だけ受理する。
              run = payload([f"repos/{repository}/actions/runs/{identifier}"])
              validate(run)
              if run.get("status") != "completed":
                  raise SystemExit("Unable to cancel a prior governance writer.")
          for _ in range(150):
              pending = []
              for identifier in targets:
                  run = payload([f"repos/{repository}/actions/runs/{identifier}"])
                  validate(run)
                  if run.get("status") != "completed":
                      pending.append(identifier)
              if not pending:
                  raise SystemExit(0)
              time.sleep(2)
          raise SystemExit("Prior governance writer did not reach a terminal state.")
          PY

      - name: Create invalidator read-only App token
        if: steps.current-targets.outputs.has_targets == 'true'
        id: invalidator-read-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.KRR_GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.KRR_GOVERNANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: read

      - name: Invalidate event targets before early dispatch
        if: steps.current-targets.outputs.has_priority_targets == 'true'
        env:
          GH_TOKEN: ${{ steps.invalidator-read-token.outputs.token }}
          CHECK_WRITE_TOKEN: ${{ steps.invalidator-token.outputs.token }}
          CHECK_APP_ID: ${{ vars.KRR_GOVERNANCE_APP_ID }}
          AFFECTED: ${{ steps.current-targets.outputs.priority_targets }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys, time
          from urllib.parse import parse_qs, urlencode, urlparse
          repository=os.environ["GITHUB_REPOSITORY"]
          token=os.environ.get("CHECK_WRITE_TOKEN", "")
          app_id=os.environ.get("CHECK_APP_ID", "")
          if not token or re.fullmatch(r"[1-9][0-9]*", app_id) is None:
              raise SystemExit("Governance invalidator credentials are invalid.")
          try: numbers=json.loads(os.environ.get("AFFECTED", ""))
          except json.JSONDecodeError as error: raise SystemExit("Affected pull request set is invalid.") from error
          if not isinstance(numbers,list) or not numbers or any(type(number) is not int or number < 1 for number in numbers) or len(set(numbers)) != len(numbers): raise SystemExit("Affected pull request set is invalid.")
          failures=[]
          # queue待機中に先行dispatcherが更新し得るため、初回も待機する。
          next_write_at=time.monotonic()+8.1
          for number in numbers:
              current=subprocess.run(["gh","api",f"repos/{repository}/pulls/{number}"],capture_output=True,text=True,check=False)
              if current.returncode != 0:
                  failures.append(number); continue
              try:
                  pull=json.loads(current.stdout)
                  head=pull.get("head",{}).get("sha") if isinstance(pull,dict) else None
                  draft=pull.get("draft") if isinstance(pull,dict) else None
              except json.JSONDecodeError:
                  head=draft=None
              if not isinstance(head,str) or re.fullmatch(r"[0-9a-fA-F]{40}",head) is None or type(draft) is not bool:
                  failures.append(number); continue
              external_id=f"krr-governance/v1/{head.lower()}"
              query=urlencode({"check_name":"KRR / PR governance (trusted check)","app_id":app_id,"filter":"all","per_page":100})
              listed=subprocess.run(["gh","api","--paginate","--slurp",f"repos/{repository}/commits/{head}/check-runs?{query}"],capture_output=True,text=True,check=False)
              if listed.returncode != 0: failures.append(number); continue
              try:
                  pages=json.loads(listed.stdout)
                  named=[run for page in pages for run in page.get("check_runs",[]) if isinstance(run,dict) and run.get("name")=="KRR / PR governance (trusted check)"]
                  # A same-name result from another App is not a governance
                  # candidate even when GitHub returns it despite app_id.
                  runs=[run for run in named if isinstance(run.get("app"),dict) and str(run["app"].get("id"))==app_id]
              except (json.JSONDecodeError, AttributeError): failures.append(number); continue
              if len(runs)>1: failures.append(number); continue
              run=runs[0] if runs else None
              app=run.get("app") if isinstance(run,dict) else None
              valid_existing_state=run is None or (run.get("status")=="in_progress" and run.get("conclusion") is None) or (run.get("status")=="completed" and run.get("conclusion") in {"success","failure"})
              if run is not None and (run.get("head_sha")!=head or run.get("external_id")!=external_id or not valid_existing_state or not isinstance(app,dict) or str(app.get("id"))!=app_id or type(run.get("id")) is not int): failures.append(number); continue
              server_url=os.environ["GITHUB_SERVER_URL"]
              dispatcher_run_id=os.environ["GITHUB_RUN_ID"]
              base_details=f"{server_url}/{repository}/actions/runs/"
              base_parts=urlparse(base_details)
              def is_prior_dispatcher_invalidation(details):
                  if not isinstance(details,str): return False
                  parts=urlparse(details)
                  if parts.scheme != base_parts.scheme or parts.netloc != base_parts.netloc or parts.params or parts.fragment:
                      return False
                  run_id=parts.path.removeprefix(base_parts.path)
                  query=parse_qs(parts.query,keep_blank_values=True)
                  return bool(re.fullmatch(r"[1-9][0-9]*",run_id)) and parts.path == base_parts.path + run_id and query.keys() == {"dispatcher_run_id","carry_pending"} and query["dispatcher_run_id"] == [run_id] and query["carry_pending"] in (["0"],["1"])
              carry_pending=int(draft is False and run is not None and run.get("status")=="in_progress" and run.get("conclusion") is None and is_prior_dispatcher_invalidation(run.get("details_url")))
              details=base_details + dispatcher_run_id + "?" + urlencode({"dispatcher_run_id":dispatcher_run_id,"carry_pending":str(carry_pending)})
              if not runs:
                  command=["gh","api","--method","POST",f"repos/{repository}/check-runs","-f","name=KRR / PR governance (trusted check)","-f",f"head_sha={head}","-f",f"external_id={external_id}","-f","status=in_progress","-f",f"details_url={details}"]
              else:
                  command=["gh","api","--method","PATCH",f"repos/{repository}/check-runs/{run['id']}","-f","status=in_progress","-f",f"details_url={details}"]
              delay=next_write_at-time.monotonic()
              if delay > 0:
                  time.sleep(delay)
              next_write_at=time.monotonic()+8.1
              result=subprocess.run(command,capture_output=True,text=True,check=False,env={"GH_TOKEN":token,"PATH":os.environ["PATH"]})
              if result.returncode != 0:
                  failures.append(number); continue
              try:
                  response=json.loads(result.stdout)
                  identifier=response.get("id") if isinstance(response,dict) else None
                  posted_by=response.get("app",{}).get("id") if isinstance(response,dict) and isinstance(response.get("app"),dict) else None
              except json.JSONDecodeError:
                  identifier=posted_by=None
              if type(identifier) is not int or identifier < 1 or str(posted_by) != app_id or response.get("name")!="KRR / PR governance (trusted check)" or response.get("head_sha")!=head or response.get("external_id")!=external_id or response.get("status")!="in_progress" or response.get("conclusion") is not None or response.get("details_url")!=details:
                  failures.append(number); continue
              reread=subprocess.run(["gh","api",f"repos/{repository}/check-runs/{identifier}"],capture_output=True,text=True,check=False)
              if reread.returncode != 0: failures.append(number); continue
              try: current_check=json.loads(reread.stdout)
              except json.JSONDecodeError: failures.append(number); continue
              if not isinstance(current_check,dict) or current_check.get("id")!=identifier or current_check.get("name")!="KRR / PR governance (trusted check)" or current_check.get("head_sha")!=head or current_check.get("external_id")!=external_id or current_check.get("status")!="in_progress" or current_check.get("conclusion") is not None or current_check.get("details_url")!=details or not isinstance(current_check.get("app"),dict) or str(current_check["app"].get("id"))!=app_id:
                  failures.append(number)
          if failures:
              raise SystemExit("Unable to invalidate one or more current pull requests.")
          PY

      - name: Dispatch and bind the early event writer
        if: steps.current-targets.outputs.has_priority_targets == 'true'
        id: dispatch-early
        env:
          GH_TOKEN: ${{ steps.dispatcher-token.outputs.token }}
          DEFAULT_BRANCH: ${{ steps.current-targets.outputs.default_branch }}
          WRITER_HEAD: ${{ steps.current-targets.outputs.writer_head }}
          TARGETS: ${{ steps.current-targets.outputs.priority_targets }}
          DISPATCHER_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, time
          repository=os.environ["GITHUB_REPOSITORY"]
          branch=os.environ.get("DEFAULT_BRANCH", "")
          head=os.environ.get("WRITER_HEAD", "")
          source=os.environ.get("DISPATCHER_RUN_ID", "")
          try: targets=json.loads(os.environ.get("TARGETS", ""))
          except json.JSONDecodeError as error: raise SystemExit("Early writer targets are invalid.") from error
          if not re.fullmatch(r"[A-Za-z0-9._/-]+", branch) or not re.fullmatch(r"[0-9a-fA-F]{40}", head) or not re.fullmatch(r"[1-9][0-9]*", source) or not isinstance(targets, list) or not targets or any(type(number) is not int or number < 1 for number in targets) or len(set(targets)) != len(targets): raise SystemExit("Early writer boundary is invalid.")
          title=f"source={source} scope=early"
          workflow_path=".github/workflows/pr-governance-status-writer.yml"
          def path_matches(value):
              if value == workflow_path: return True
              if not isinstance(value,str) or not value.startswith(workflow_path+"@"): return False
              ref=value[len(workflow_path)+1:]
              return re.fullmatch(r"[A-Za-z0-9._/-]+",ref) is not None and ref not in {".",".."} and not ref.startswith("/") and "//" not in ref and all(part not in {"",".",".."} for part in ref.split("/"))
          def runs():
              result=subprocess.run(["gh","api","--paginate","--slurp",f"repos/{repository}/actions/workflows/pr-governance-status-writer.yml/runs?per_page=100"],capture_output=True,text=True,check=False)
              if result.returncode != 0: raise SystemExit("Unable to enumerate governance writer runs.")
              try: pages=json.loads(result.stdout)
              except json.JSONDecodeError as error: raise SystemExit("Governance writer runs are not JSON.") from error
              if not isinstance(pages,list) or not all(isinstance(page,dict) and isinstance(page.get("workflow_runs"),list) for page in pages): raise SystemExit("Governance writer runs are invalid.")
              return [run for page in pages for run in page["workflow_runs"] if isinstance(run,dict)]
          before={run.get("id") for run in runs() if type(run.get("id")) is int}
          result=subprocess.run(["gh","api","--method","POST",f"repos/{repository}/actions/workflows/pr-governance-status-writer.yml/dispatches","-f",f"ref={branch}","-f",f"inputs[dispatcher_run_id]={source}","-f","inputs[scope]=early","-f",f"inputs[target_numbers]={json.dumps(targets,separators=(',', ':'))}"],capture_output=True,text=True,check=False)
          if result.returncode != 0: raise SystemExit("Unable to dispatch early governance writer.")
          for _ in range(150):
              matches=[]
              for run in runs():
                  identifier=run.get("id"); repository_value=run.get("repository")
                  if identifier in before or run.get("display_title") != title: continue
                  if not (type(identifier) is int and identifier > 0 and run.get("name")=="PR governance status writer" and path_matches(run.get("path")) and run.get("event")=="workflow_dispatch" and isinstance(repository_value,dict) and repository_value.get("full_name")==repository and run.get("head_branch")==branch and run.get("head_sha")==head and run.get("status") in {"requested","queued","pending","waiting","in_progress","completed"} and type(run.get("run_number")) is int and run["run_number"]>0 and type(run.get("run_attempt")) is int and run["run_attempt"]>0): raise SystemExit("Early governance writer registration identity is invalid.")
                  matches.append(identifier)
              if len(matches)==1:
                  with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as output: output.write(f"writer_run_id={matches[0]}\n")
                  raise SystemExit(0)
              if len(matches)>1: raise SystemExit("Early governance writer registration is ambiguous.")
              time.sleep(2)
          raise SystemExit("Early governance writer registration timed out.")
          PY

      - name: Await the bound early event writer before all-open invalidation
        if: steps.current-targets.outputs.has_priority_targets == 'true'
        env:
          GH_TOKEN: ${{ steps.dispatcher-token.outputs.token }}
          WRITER_RUN_ID: ${{ steps.dispatch-early.outputs.writer_run_id }}
          DEFAULT_BRANCH: ${{ steps.current-targets.outputs.default_branch }}
          WRITER_HEAD: ${{ steps.current-targets.outputs.writer_head }}
          DISPATCHER_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, time
          repository=os.environ["GITHUB_REPOSITORY"]; identifier=os.environ.get("WRITER_RUN_ID", ""); branch=os.environ.get("DEFAULT_BRANCH", ""); head=os.environ.get("WRITER_HEAD", ""); source=os.environ.get("DISPATCHER_RUN_ID", "")
          if not re.fullmatch(r"[1-9][0-9]*",identifier) or not re.fullmatch(r"[A-Za-z0-9._/-]+",branch) or not re.fullmatch(r"[0-9a-fA-F]{40}",head) or not re.fullmatch(r"[1-9][0-9]*",source): raise SystemExit("Early governance writer ID is invalid.")
          workflow_path=".github/workflows/pr-governance-status-writer.yml"; title=f"source={source} scope=early"
          def path_matches(value):
              if value == workflow_path: return True
              if not isinstance(value,str) or not value.startswith(workflow_path+"@"): return False
              ref=value[len(workflow_path)+1:]
              return re.fullmatch(r"[A-Za-z0-9._/-]+",ref) is not None and ref not in {".",".."} and not ref.startswith("/") and "//" not in ref and all(part not in {"",".",".."} for part in ref.split("/"))
          for _ in range(450):
              result=subprocess.run(["gh","api",f"repos/{repository}/actions/runs/{identifier}"],capture_output=True,text=True,check=False)
              if result.returncode != 0: raise SystemExit("Unable to read early governance writer.")
              try: run=json.loads(result.stdout)
              except json.JSONDecodeError as error: raise SystemExit("Early governance writer is not JSON.") from error
              run_repository=run.get("repository") if isinstance(run,dict) else None
              if not isinstance(run,dict) or run.get("id")!=int(identifier) or run.get("name")!="PR governance status writer" or run.get("display_title")!=title or not path_matches(run.get("path")) or run.get("event")!="workflow_dispatch" or not isinstance(run_repository,dict) or run_repository.get("full_name")!=repository or run.get("head_branch")!=branch or run.get("head_sha")!=head or run.get("status") not in {"requested","queued","pending","waiting","in_progress","completed"} or type(run.get("run_number")) is not int or run["run_number"]<1 or type(run.get("run_attempt")) is not int or run["run_attempt"]<1: raise SystemExit("Early governance writer identity is invalid.")
              if run.get("status")=="completed":
                  if run.get("conclusion")!="success": raise SystemExit("Early governance writer failed closed.")
                  raise SystemExit(0)
              time.sleep(2)
          raise SystemExit("Early governance writer did not reach a terminal state.")
          PY

      - name: Invalidate every current pull request for the all-open writer
        if: steps.current-targets.outputs.has_targets == 'true'
        env:
          GH_TOKEN: ${{ steps.invalidator-read-token.outputs.token }}
          CHECK_WRITE_TOKEN: ${{ steps.invalidator-token.outputs.token }}
          CHECK_APP_ID: ${{ vars.KRR_GOVERNANCE_APP_ID }}
          AFFECTED: ${{ steps.current-targets.outputs.targets }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, time
          from urllib.parse import parse_qs, urlencode, urlparse
          repository=os.environ["GITHUB_REPOSITORY"]; token=os.environ.get("CHECK_WRITE_TOKEN", ""); app_id=os.environ.get("CHECK_APP_ID", "")
          if not token or re.fullmatch(r"[1-9][0-9]*",app_id) is None: raise SystemExit("Governance invalidator credentials are invalid.")
          try: numbers=json.loads(os.environ.get("AFFECTED", ""))
          except json.JSONDecodeError as error: raise SystemExit("Affected pull request set is invalid.") from error
          if not isinstance(numbers,list) or not numbers or any(type(number) is not int or number<1 for number in numbers) or len(set(numbers))!=len(numbers): raise SystemExit("Affected pull request set is invalid.")
          failures=[]; next_write_at=time.monotonic()+8.1
          for number in numbers:
              current=subprocess.run(["gh","api",f"repos/{repository}/pulls/{number}"],capture_output=True,text=True,check=False)
              if current.returncode!=0: failures.append(number); continue
              try:
                  pull=json.loads(current.stdout); head=pull.get("head",{}).get("sha") if isinstance(pull,dict) else None; draft=pull.get("draft") if isinstance(pull,dict) else None
              except json.JSONDecodeError: head=draft=None
              if not isinstance(head,str) or re.fullmatch(r"[0-9a-fA-F]{40}",head) is None or type(draft) is not bool: failures.append(number); continue
              external_id=f"krr-governance/v1/{head.lower()}"; query=urlencode({"check_name":"KRR / PR governance (trusted check)","app_id":app_id,"filter":"all","per_page":100})
              listed=subprocess.run(["gh","api","--paginate","--slurp",f"repos/{repository}/commits/{head}/check-runs?{query}"],capture_output=True,text=True,check=False)
              if listed.returncode!=0: failures.append(number); continue
              try:
                  pages=json.loads(listed.stdout); named=[run for page in pages for run in page.get("check_runs",[]) if isinstance(run,dict) and run.get("name")=="KRR / PR governance (trusted check)"]; runs=[run for run in named if isinstance(run.get("app"),dict) and str(run["app"].get("id"))==app_id]
              except (json.JSONDecodeError,AttributeError): failures.append(number); continue
              if len(runs)>1: failures.append(number); continue
              run=runs[0] if runs else None; app=run.get("app") if isinstance(run,dict) else None
              valid=run is None or (run.get("status")=="in_progress" and run.get("conclusion") is None) or (run.get("status")=="completed" and run.get("conclusion") in {"success","failure"})
              if run is not None and (run.get("head_sha")!=head or run.get("external_id")!=external_id or not valid or not isinstance(app,dict) or str(app.get("id"))!=app_id or type(run.get("id")) is not int): failures.append(number); continue
              base=f"{os.environ['GITHUB_SERVER_URL']}/{repository}/actions/runs/"; base_parts=urlparse(base); dispatcher=os.environ["GITHUB_RUN_ID"]
              def is_prior_dispatcher_invalidation(details):
                  if not isinstance(details,str): return False
                  parts=urlparse(details); query_values=parse_qs(parts.query,keep_blank_values=True); run_id=parts.path.removeprefix(base_parts.path)
                  return parts.scheme==base_parts.scheme and parts.netloc==base_parts.netloc and not parts.params and not parts.fragment and bool(re.fullmatch(r"[1-9][0-9]*",run_id)) and parts.path==base_parts.path+run_id and query_values.keys()=={"dispatcher_run_id","carry_pending"} and query_values["dispatcher_run_id"]==[run_id] and query_values["carry_pending"] in (["0"],["1"])
              carry_pending=int(draft is False and run is not None and run.get("status")=="in_progress" and run.get("conclusion") is None and is_prior_dispatcher_invalidation(run.get("details_url")))
              details=base+dispatcher+"?"+urlencode({"dispatcher_run_id":dispatcher,"carry_pending":str(carry_pending)})
              command=["gh","api","--method","POST",f"repos/{repository}/check-runs","-f","name=KRR / PR governance (trusted check)","-f",f"head_sha={head}","-f",f"external_id={external_id}","-f","status=in_progress","-f",f"details_url={details}"] if run is None else ["gh","api","--method","PATCH",f"repos/{repository}/check-runs/{run['id']}","-f","status=in_progress","-f",f"details_url={details}"]
              delay=next_write_at-time.monotonic()
              if delay>0: time.sleep(delay)
              next_write_at=time.monotonic()+8.1
              result=subprocess.run(command,capture_output=True,text=True,check=False,env={"GH_TOKEN":token,"PATH":os.environ["PATH"]})
              if result.returncode!=0: failures.append(number); continue
              try: response=json.loads(result.stdout); identifier=response.get("id") if isinstance(response,dict) else None; posted=response.get("app",{}).get("id") if isinstance(response,dict) and isinstance(response.get("app"),dict) else None
              except json.JSONDecodeError: identifier=posted=None
              if type(identifier) is not int or identifier<1 or str(posted)!=app_id or response.get("name")!="KRR / PR governance (trusted check)" or response.get("head_sha")!=head or response.get("external_id")!=external_id or response.get("status")!="in_progress" or response.get("conclusion") is not None or response.get("details_url")!=details: failures.append(number); continue
              reread=subprocess.run(["gh","api",f"repos/{repository}/check-runs/{identifier}"],capture_output=True,text=True,check=False)
              if reread.returncode!=0: failures.append(number); continue
              try: check=json.loads(reread.stdout)
              except json.JSONDecodeError: failures.append(number); continue
              if not isinstance(check,dict) or check.get("id")!=identifier or check.get("name")!="KRR / PR governance (trusted check)" or check.get("head_sha")!=head or check.get("external_id")!=external_id or check.get("status")!="in_progress" or check.get("conclusion") is not None or check.get("details_url")!=details or not isinstance(check.get("app"),dict) or str(check["app"].get("id"))!=app_id: failures.append(number)
          if failures: raise SystemExit("Unable to invalidate one or more current pull requests.")
          PY

      - name: Dispatch one repository-wide governance arbiter
        if: steps.current-targets.outputs.has_targets == 'true'
        env:
          GH_TOKEN: ${{ steps.dispatcher-token.outputs.token }}
          DEFAULT_BRANCH: ${{ steps.current-targets.outputs.default_branch }}
          WRITER_HEAD: ${{ steps.current-targets.outputs.writer_head }}
          DISPATCHER_RUN_ID: ${{ github.run_id }}
          WRITER_SCOPE: all
          WRITER_TARGETS: '[]'
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ.get("DEFAULT_BRANCH", "")
          writer_head = os.environ.get("WRITER_HEAD", "")
          dispatcher_run_id = os.environ.get("DISPATCHER_RUN_ID", "")
          if not isinstance(branch, str) or re.fullmatch(r"[A-Za-z0-9._/-]+", branch) is None or re.fullmatch(r"[0-9a-fA-F]{40}", writer_head) is None or re.fullmatch(r"[1-9][0-9]*", dispatcher_run_id) is None:
              raise SystemExit("Governance dispatch inputs are invalid.")
          workflow_path = ".github/workflows/pr-governance-status-writer.yml"
          scope = os.environ.get("WRITER_SCOPE", "")
          raw_targets = os.environ.get("WRITER_TARGETS", "")
          if scope != "all" or raw_targets != "[]":
              raise SystemExit("Governance all-open dispatch boundary is invalid.")
          expected_title = f"source={dispatcher_run_id} scope={scope}"
          def path_matches(value):
              if value == workflow_path:
                  return True
              if not isinstance(value, str) or not value.startswith(workflow_path + "@"):
                  return False
              ref = value[len(workflow_path) + 1:]
              return re.fullmatch(r"[A-Za-z0-9._/-]+", ref) is not None and ref not in {".", ".."} and not ref.startswith("/") and "//" not in ref and all(part not in {"", ".", ".."} for part in ref.split("/"))
          def runs():
              listed = subprocess.run(["gh", "api", "--paginate", "--slurp", f"repos/{repository}/actions/workflows/pr-governance-status-writer.yml/runs?per_page=100"], capture_output=True, text=True, check=False)
              if listed.returncode != 0:
                  raise SystemExit("Unable to enumerate governance writer runs.")
              try:
                  pages = json.loads(listed.stdout)
              except json.JSONDecodeError as error:
                  raise SystemExit("Governance writer runs are not JSON.") from error
              if not isinstance(pages, list) or not all(isinstance(page, dict) and isinstance(page.get("workflow_runs"), list) for page in pages):
                  raise SystemExit("Governance writer runs are invalid.")
              flattened = [run for page in pages for run in page["workflow_runs"]]
              if not all(isinstance(run, dict) for run in flattened):
                  raise SystemExit("Governance writer run is invalid.")
              return flattened
          before = runs()
          before_ids = {run.get("id") for run in before if type(run.get("id")) is int}
          if len(before_ids) != len(before):
              raise SystemExit("Governance writer run identity is invalid.")
          result = subprocess.run(["gh", "api", "--method", "POST", f"repos/{repository}/actions/workflows/pr-governance-status-writer.yml/dispatches", "-f", f"ref={branch}", "-f", f"inputs[dispatcher_run_id]={dispatcher_run_id}", "-f", f"inputs[scope]={scope}", "-f", f"inputs[target_numbers]={raw_targets}"], capture_output=True, text=True, check=False)
          if result.returncode != 0:
              raise SystemExit("Unable to dispatch governance arbiter.")
          for _ in range(150):
              candidates = []
              for run in runs():
                  identifier = run.get("id")
                  run_repository = run.get("repository")
                  if identifier in before_ids:
                      continue
                  # 同じworkflowの別dispatchはsource表示が異なるため相関対象にしない。
                  if run.get("display_title") != expected_title:
                      continue
                  if (
                      type(identifier) is not int or identifier < 1
                      or run.get("name") != "PR governance status writer"
                      or run.get("display_title") != expected_title
                      or not path_matches(run.get("path"))
                      or run.get("event") != "workflow_dispatch"
                      or not isinstance(run_repository, dict) or run_repository.get("full_name") != repository
                      or run.get("head_branch") != branch or run.get("head_sha") != writer_head
                      or run.get("status") not in {"requested", "queued", "pending", "waiting", "in_progress", "completed"}
                      or type(run.get("run_number")) is not int or run.get("run_number") < 1
                      or type(run.get("run_attempt")) is not int or run.get("run_attempt") < 1
                  ):
                      raise SystemExit("Governance writer registration identity is invalid.")
                  candidates.append(identifier)
              if len(candidates) == 1:
                  break
              if len(candidates) > 1:
                  raise SystemExit("Governance writer registration is ambiguous.")
              subprocess.run(["sleep", "2"], check=False)
          else:
              raise SystemExit("Governance writer registration timed out.")
          PY
