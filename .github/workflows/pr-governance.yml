      - name: Create dispatcher App token after priority preinvalidation
        if: steps.current-targets.outputs.has_targets == 'true'
        id: dispatcher-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.KRR_GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.KRR_GOVERNANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
          permission-checks: read
          permission-contents: read
          permission-pull-requests: read

      - name: Drain authoritative writer before the next governance hand-off
        # Priority pre-invalidation creates the fail-closed barrier first;
        # drain then proves a former writer cannot terminally publish before
        # the bound early writer acquires the singleton.
        if: steps.current-targets.outputs.has_targets == 'true'
        env:
          GH_TOKEN: ${{ steps.dispatcher-token.outputs.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys, time
          from urllib.parse import urlencode

          repository = os.environ["GITHUB_REPOSITORY"]
          writer_path = ".github/workflows/pr-governance-status-writer.yml"
          # workflow-runsは保持済みwriter全体を新しい順に返す。全履歴を
          # 走査すると固定snapshot上限の後ろに現行writerが隠れるため、
          # active状態ごとに明示照会する。各応答は独立に有界とし、
          # state snapshotが変化した場合はhand-off前に拒否する。
          active = ("requested", "queued", "pending", "waiting", "in_progress")

          def request(arguments):
              result = subprocess.run(["gh", "api", *arguments], capture_output=True, text=True, check=False, timeout=20)
              if result.returncode != 0:
                  raise SystemExit("Unable to drain a prior governance writer.")
              return result.stdout

          def payload(arguments):
              try:
                  return json.loads(request(arguments))
              except json.JSONDecodeError as error:
                  raise SystemExit("Governance writer API response is not JSON.") from error

          def path_matches(value):
              if value == writer_path:
                  return True
              if not isinstance(value, str) or not value.startswith(writer_path + "@"):
                  return False
              ref = value[len(writer_path) + 1:]
              return re.fullmatch(r"[A-Za-z0-9._/-]+", ref) is not None and ref not in {".", ".."} and not ref.startswith("/") and "//" not in ref and all(part not in {"", ".", ".."} for part in ref.split("/"))

          repository_value = payload([f"repos/{repository}"])
          branch = repository_value.get("default_branch") if isinstance(repository_value, dict) else None
          if not isinstance(branch, str) or re.fullmatch(r"[A-Za-z0-9._/-]+", branch) is None:
              raise SystemExit("Repository default branch is invalid.")
          reference = payload([f"repos/{repository}/git/ref/heads/{branch}"])
          default_head = reference.get("object", {}).get("sha") if isinstance(reference, dict) and isinstance(reference.get("object"), dict) else None
          if not isinstance(default_head, str) or re.fullmatch(r"[0-9a-fA-F]{40}", default_head) is None:
              raise SystemExit("Repository default head is invalid.")
          workflow = payload([f"repos/{repository}/actions/workflows/{writer_path.rsplit('/', 1)[-1]}"])
          workflow_id = workflow.get("id") if isinstance(workflow, dict) else None
          if type(workflow_id) is not int or workflow_id < 1:
              raise SystemExit("Governance writer workflow ID is invalid.")
          class ActiveWriterSnapshotChanged(Exception):
              pass

          def active_writer_runs(status):
              if status not in active:
                  raise SystemExit("Governance writer run status is invalid.")
              # head SHAや作成時刻で絞ると古いdefault-branch writerを
              # 見落とす。activeである限り次のhand-off前にcancelする。
              query = urlencode({"event": "workflow_dispatch", "branch": branch, "status": status, "per_page": "100"})
              arguments = ["gh", "api", f"repos/{repository}/actions/workflows/{workflow_id}/runs?{query}"]
              try:
                  result = subprocess.run(arguments, capture_output=True, text=True, check=False, timeout=20)
              except subprocess.TimeoutExpired as error:
                  raise SystemExit("Governance writer run list timed out.") from error
              if result.returncode != 0:
                  raise SystemExit("Unable to enumerate governance writer runs.")
              try:
                  page = json.loads(result.stdout)
              except json.JSONDecodeError as error:
                  raise SystemExit("Governance writer run list is not JSON.") from error
              entries = page.get("workflow_runs") if isinstance(page, dict) else None
              total = page.get("total_count") if isinstance(page, dict) else None
              if not isinstance(page, dict) or not isinstance(entries, list) or len(entries) > 100 or not all(isinstance(run, dict) for run in entries) or type(total) is not int or total < 0 or total > 100 or len(entries) != total:
                  raise SystemExit("Governance writer run list is invalid.")
              identifiers = set()
              for run in entries:
                  identifier = run.get("id")
                  observed_status = run.get("status")
                  if type(identifier) is not int or identifier < 1 or identifier in identifiers:
                      raise SystemExit("Governance writer run list is invalid.")
                  identifiers.add(identifier)
                  # A run can move requested→queued→in_progress while the
                  # five state partitions are being read. Retry the whole
                  # snapshot rather than treating that ordinary transition as
                  # a terminal hand-off failure; unknown states remain invalid.
                  if observed_status != status:
                      if observed_status in active or observed_status == "completed":
                          raise ActiveWriterSnapshotChanged
                      raise SystemExit("Governance writer run status is invalid.")
              return entries

          def active_writer_snapshot():
              snapshot = {status: active_writer_runs(status) for status in active}
              identifiers = [run["id"] for runs in snapshot.values() for run in runs]
              if len(set(identifiers)) != len(identifiers):
                  # A transition can make one run visible in two partitions
                  # during a single enumeration. It is not safe to cancel
                  # until a complete snapshot is stable.
                  raise ActiveWriterSnapshotChanged
              return snapshot

          listed = None
          active_snapshot_attempts = 4
          for attempt in range(active_snapshot_attempts):
              try:
                  first_snapshot = active_writer_snapshot()
                  second_snapshot = active_writer_snapshot()
              except ActiveWriterSnapshotChanged:
                  if attempt + 1 == active_snapshot_attempts:
                      raise SystemExit("Governance writer active run list did not stabilize.")
                  time.sleep(1)
                  continue
              if first_snapshot == second_snapshot:
                  listed = second_snapshot
                  break
              if attempt + 1 == active_snapshot_attempts:
                  raise SystemExit("Governance writer active run list did not stabilize.")
              time.sleep(1)
          if not isinstance(listed, dict):
              raise SystemExit("Governance writer active run list did not stabilize.")

          def validate(run):
              run_repository = run.get("repository") if isinstance(run, dict) else None
              if not (
                  isinstance(run, dict) and type(run.get("id")) is int and run["id"] > 0
                  and run.get("name") == "PR governance status writer" and path_matches(run.get("path"))
                  and run.get("event") == "workflow_dispatch" and isinstance(run.get("head_sha"), str)
                  and re.fullmatch(r"[0-9a-fA-F]{40}", run["head_sha"]) is not None
                  and run.get("workflow_id") == workflow_id and isinstance(run_repository, dict)
                  and run_repository.get("full_name") == repository
                  and type(run.get("run_number")) is int and run["run_number"] > 0
                  and type(run.get("run_attempt")) is int and run["run_attempt"] == 1
                  and isinstance(run.get("status"), str)
              ):
                  raise SystemExit("Governance writer run identity is invalid.")

          targets = []
          for status in active:
              for run in listed[status]:
                  validate(run)
                  targets.append(run["id"])
          if len(set(targets)) != len(targets):
              raise SystemExit("Governance writer run list is duplicated.")
          for identifier in targets:
              cancel = subprocess.run(["gh", "api", "--method", "POST", f"repos/{repository}/actions/runs/{identifier}/cancel"], capture_output=True, text=True, check=False, timeout=20)
              if cancel.returncode == 0:
                  continue
              # 一覧取得からcancelの間に完了した競合は、再読でterminalを
              # 確認できた場合だけ受理する。
              run = payload([f"repos/{repository}/actions/runs/{identifier}"])
              validate(run)
              if run.get("status") != "completed":
                  raise SystemExit("Unable to cancel a prior governance writer.")
          for _ in range(150):
              pending = []
              for identifier in targets:
                  run = payload([f"repos/{repository}/actions/runs/{identifier}"])
                  validate(run)
                  if run.get("status") != "completed":
                      pending.append(identifier)
              if not pending:
                  raise SystemExit(0)
              time.sleep(2)
          raise SystemExit("Prior governance writer did not reach a terminal state.")
          PY

      - name: Dispatch and bind the early event writer
        if: steps.current-targets.outputs.has_priority_targets == 'true'
        id: dispatch-early
        env:
          GH_TOKEN: ${{ steps.dispatcher-token.outputs.token }}
          DEFAULT_BRANCH: ${{ steps.current-targets.outputs.default_branch }}
          WRITER_HEAD: ${{ steps.current-targets.outputs.writer_head }}
          TARGETS: ${{ steps.current-targets.outputs.priority_targets }}
          DISPATCHER_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, time
          from datetime import datetime
          repository=os.environ["GITHUB_REPOSITORY"]
          branch=os.environ.get("DEFAULT_BRANCH", "")
          head=os.environ.get("WRITER_HEAD", "")
          source=os.environ.get("DISPATCHER_RUN_ID", "")
          try: targets=json.loads(os.environ.get("TARGETS", ""))
          except json.JSONDecodeError as error: raise SystemExit("Early writer targets are invalid.") from error
          if not re.fullmatch(r"[A-Za-z0-9._/-]+", branch) or not re.fullmatch(r"[0-9a-fA-F]{40}", head) or not re.fullmatch(r"[1-9][0-9]*", source) or not isinstance(targets, list) or not targets or len(targets)>40 or any(type(number) is not int or number < 1 for number in targets) or len(set(targets)) != len(targets): raise SystemExit("Early writer boundary is invalid.")
          title=f"source={source} scope=early segment=0"
          workflow_path=".github/workflows/pr-governance-status-writer.yml"
          def path_matches(value):
              if value == workflow_path: return True
              if not isinstance(value,str) or not value.startswith(workflow_path+"@"): return False
              ref=value[len(workflow_path)+1:]
              return re.fullmatch(r"[A-Za-z0-9._/-]+",ref) is not None and ref not in {".",".."} and not ref.startswith("/") and "//" not in ref and all(part not in {"",".",".."} for part in ref.split("/"))
          def runs_page(page_number):
              arguments=["gh","api",f"repos/{repository}/actions/workflows/pr-governance-status-writer.yml/runs?per_page=100&page={page_number}"]
              if page_number == 6: arguments.insert(2,"--include")
              try: result=subprocess.run(arguments,capture_output=True,text=True,check=False,timeout=20)
              except subprocess.TimeoutExpired as error: raise SystemExit("Governance writer runs timed out.") from error
              if result.returncode != 0: raise SystemExit("Unable to enumerate governance writer runs.")
              try:
                  raw=result.stdout
                  if page_number == 6:
                      headers,separator,raw=raw.replace("\r\n","\n").partition("\n\n")
                      if not separator or not headers.startswith("HTTP/") or re.search(r'(?im)^link:.*rel="next"',headers): raise SystemExit("Governance writer runs exceed the fixed page window.")
                  page=json.loads(raw)
              except json.JSONDecodeError as error: raise SystemExit("Governance writer runs are not JSON.") from error
              entries=page.get("workflow_runs") if isinstance(page,dict) else None; total=page.get("total_count") if isinstance(page,dict) else None
              if not isinstance(page,dict) or not isinstance(entries,list) or len(entries)>100 or not all(isinstance(run,dict) for run in entries) or type(total) is not int or total<0: raise SystemExit("Governance writer runs are invalid.")
              return page
          def runs():
              pages=[runs_page(1)]; total_count=pages[0]["total_count"]
              for page_number in range(2,7):
                  if len(pages[-1]["workflow_runs"])<100: break
                  page=runs_page(page_number)
                  if page["total_count"]!=total_count: raise SystemExit("Governance writer run count changed.")
                  pages.append(page)
              if runs_page(1)!=pages[0]: raise SystemExit("Governance writer runs first page changed.")
              flattened=[run for page in pages for run in page["workflow_runs"]]
              if len(flattened)!=total_count: raise SystemExit("Governance writer run count is incomplete.")
              return flattened
          before={run.get("id") for run in runs() if type(run.get("id")) is int}
          result=subprocess.run(["gh","api","--method","POST",f"repos/{repository}/actions/workflows/pr-governance-status-writer.yml/dispatches","-f",f"ref={branch}","-f",f"inputs[dispatcher_run_id]={source}","-f","inputs[scope]=early","-f",f"inputs[target_numbers]={json.dumps(targets,separators=(',', ':'))}","-f","inputs[preserved_target_numbers]=[]","-f","inputs[preserved_writer_run_id]=0","-f","inputs[check_manifest]=[]","-f","inputs[terminal_batch_numbers]=[]","-f","inputs[continuation_index]=0","-f","inputs[terminal_order_numbers]=[]","-f","inputs[completed_writer_run_ids]=[]"],capture_output=True,text=True,check=False, timeout=20)
          if result.returncode != 0: raise SystemExit("Unable to dispatch early governance writer.")
          # Registration is asynchronous; 5s polling avoids needless
          # installation REST pressure while retaining a five-minute bound.
          for _ in range(60):
              matches=[]
              for run in runs():
                  identifier=run.get("id"); repository_value=run.get("repository")
                  if identifier in before or run.get("display_title") != title: continue
                  if not (type(identifier) is int and identifier > 0 and run.get("name")=="PR governance status writer" and path_matches(run.get("path")) and run.get("event")=="workflow_dispatch" and isinstance(repository_value,dict) and repository_value.get("full_name")==repository and run.get("head_branch")==branch and run.get("head_sha")==head and run.get("status") in {"requested","queued","pending","waiting","in_progress","completed"} and type(run.get("run_number")) is int and run["run_number"]>0 and type(run.get("run_attempt")) is int and run["run_attempt"] == 1): raise SystemExit("Early governance writer registration identity is invalid.")
                  matches.append(identifier)
              if len(matches)==1:
                  with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as output: output.write(f"writer_run_id={matches[0]}\n")
                  raise SystemExit(0)
              if len(matches)>1: raise SystemExit("Early governance writer registration is ambiguous.")
              time.sleep(5)
          raise SystemExit("Early governance writer registration timed out.")
          PY

      - name: Create fresh early Check Run read token
        if: steps.current-targets.outputs.has_priority_targets == 'true'
        id: early-check-read-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.KRR_GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.KRR_GOVERNANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: read
          permission-pull-requests: read

      - name: Await the bound early event writer before all-open invalidation
        if: steps.current-targets.outputs.has_priority_targets == 'true'
        id: await-early
        env:
          GH_TOKEN: ${{ steps.dispatcher-token.outputs.token }}
          WRITER_RUN_ID: ${{ steps.dispatch-early.outputs.writer_run_id }}
          DEFAULT_BRANCH: ${{ steps.current-targets.outputs.default_branch }}
          WRITER_HEAD: ${{ steps.current-targets.outputs.writer_head }}
          DISPATCHER_RUN_ID: ${{ github.run_id }}
          CHECK_APP_ID: ${{ vars.KRR_GOVERNANCE_APP_ID }}
          CHECK_READ_TOKEN: ${{ steps.early-check-read-token.outputs.token }}
          TARGETS: ${{ steps.current-targets.outputs.priority_targets }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, time
          from urllib.parse import urlparse
          repository=os.environ["GITHUB_REPOSITORY"]; identifier=os.environ.get("WRITER_RUN_ID", ""); branch=os.environ.get("DEFAULT_BRANCH", ""); head=os.environ.get("WRITER_HEAD", ""); source=os.environ.get("DISPATCHER_RUN_ID", "")
          if not re.fullmatch(r"[1-9][0-9]*",identifier) or not re.fullmatch(r"[A-Za-z0-9._/-]+",branch) or not re.fullmatch(r"[0-9a-fA-F]{40}",head) or not re.fullmatch(r"[1-9][0-9]*",source): raise SystemExit("Early governance writer ID is invalid.")
          deadline=time.time()+900
          workflow_path=".github/workflows/pr-governance-status-writer.yml"; title=f"source={source} scope=early segment=0"
          def path_matches(value):
              if value == workflow_path: return True
              if not isinstance(value,str) or not value.startswith(workflow_path+"@"): return False
              ref=value[len(workflow_path)+1:]
              return re.fullmatch(r"[A-Za-z0-9._/-]+",ref) is not None and ref not in {".",".."} and not ref.startswith("/") and "//" not in ref and all(part not in {"",".",".."} for part in ref.split("/"))
          # The early writer has at most 40 mutations.  Polling every 30s
          # bounds this wait at 15m without consuming 450 installation reads.
          for _ in range(30):
              remaining=deadline-time.time()
              if remaining<=0: break
              try: result=subprocess.run(["gh","api",f"repos/{repository}/actions/runs/{identifier}"],capture_output=True,text=True,check=False,timeout=min(20,remaining))
              except subprocess.TimeoutExpired as error: raise SystemExit("Governance terminal writer read timed out.") from error
              if time.time()>deadline: raise SystemExit("Governance terminal writer deadline elapsed.")
              if result.returncode != 0: raise SystemExit("Unable to read early governance writer.")
              try: run=json.loads(result.stdout)
              except json.JSONDecodeError as error: raise SystemExit("Early governance writer is not JSON.") from error
              run_repository=run.get("repository") if isinstance(run,dict) else None
              if not isinstance(run,dict) or run.get("id")!=int(identifier) or run.get("name")!="PR governance status writer" or run.get("display_title")!=title or not path_matches(run.get("path")) or run.get("event")!="workflow_dispatch" or not isinstance(run_repository,dict) or run_repository.get("full_name")!=repository or run.get("head_branch")!=branch or run.get("head_sha")!=head or run.get("status") not in {"requested","queued","pending","waiting","in_progress","completed"} or type(run.get("run_number")) is not int or run["run_number"]<1 or type(run.get("run_attempt")) is not int or run["run_attempt"] != 1: raise SystemExit("Early governance writer identity is invalid.")
              if run.get("status")=="completed":
                  if run.get("conclusion")!="success": raise SystemExit("Early governance writer failed closed.")
                  app_id=os.environ.get("CHECK_APP_ID", "")
                  if re.fullmatch(r"[1-9][0-9]*",app_id) is None: raise SystemExit("Early governance Check Run App ID is invalid.")
                  check_token=os.environ.get("CHECK_READ_TOKEN", "")
                  if not check_token: raise SystemExit("Early governance Check Run read token is invalid.")
                  try: targets=json.loads(os.environ.get("TARGETS", ""))
                  except json.JSONDecodeError as error: raise SystemExit("Early governance targets are invalid.") from error
                  if not isinstance(targets,list) or not targets or any(type(number) is not int or number<1 for number in targets) or len(set(targets)) != len(targets): raise SystemExit("Early governance targets are invalid.")
                  manifest=[]
                  for number in targets:
                      pull=subprocess.run(["gh","api",f"repos/{repository}/pulls/{number}"],capture_output=True,text=True,check=False,env={"GH_TOKEN":check_token,"PATH":os.environ["PATH"]}, timeout=20)
                      if pull.returncode!=0: raise SystemExit("Unable to load early governance target.")
                      try: pull_json=json.loads(pull.stdout)
                      except json.JSONDecodeError as error: raise SystemExit("Early governance target is not JSON.") from error
                      target_head=pull_json.get("head",{}).get("sha") if isinstance(pull_json,dict) and isinstance(pull_json.get("head"),dict) else None
                      if not isinstance(target_head,str) or re.fullmatch(r"[0-9a-fA-F]{40}",target_head) is None: raise SystemExit("Early governance target head is invalid.")
                      query=f"check_name=KRR%20%2F%20PR%20governance%20(trusted%20check)&app_id={app_id}&filter=all&per_page=100"
                      def check_page(page_number):
                          arguments=["gh","api",f"repos/{repository}/commits/{target_head}/check-runs?{query}&page={page_number}"]
                          if page_number == 6: arguments.insert(2,"--include")
                          try: checks=subprocess.run(arguments,capture_output=True,text=True,check=False,env={"GH_TOKEN":check_token,"PATH":os.environ["PATH"]},timeout=20)
                          except subprocess.TimeoutExpired as error: raise SystemExit("Early governance Check Run timed out.") from error
                          if checks.returncode!=0: raise SystemExit("Unable to load early governance Check Run.")
                          try:
                              raw=checks.stdout
                              if page_number == 6:
                                  headers,separator,raw=raw.replace("\r\n","\n").partition("\n\n")
                                  if not separator or not headers.startswith("HTTP/") or re.search(r'(?im)^link:.*rel="next"',headers): raise SystemExit("Early governance Check Run exceeds the fixed page window.")
                              page=json.loads(raw)
                          except json.JSONDecodeError as error: raise SystemExit("Early governance Check Run is not JSON.") from error
                          entries=page.get("check_runs") if isinstance(page,dict) else None; total=page.get("total_count") if isinstance(page,dict) else None
                          if not isinstance(page,dict) or not isinstance(entries,list) or len(entries)>100 or not all(isinstance(check,dict) for check in entries) or type(total) is not int or total<0: raise SystemExit("Early governance Check Run is invalid.")
                          return page
                      pages=[check_page(1)]; total_count=pages[0]["total_count"]
                      for page_number in range(2,7):
                          if len(pages[-1]["check_runs"])<100: break
                          page=check_page(page_number)
                          if page["total_count"]!=total_count: raise SystemExit("Early governance Check Run count changed.")
                          pages.append(page)
                      if check_page(1)!=pages[0]: raise SystemExit("Early governance Check Run first page changed.")
