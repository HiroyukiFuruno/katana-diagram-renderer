name: Release

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example v0.1.0. Defaults to Cargo.toml version."
        required: false
        type: string
      publish_crates:
        description: "Publish workspace crates to crates.io"
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  release-context:
    if: >
      github.event_name == 'workflow_dispatch' || (
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'release/v')
      )
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Resolve version
        id: version
        shell: bash
        run: |
          bash scripts/release/resolve-release-version.sh \
            "${{ github.event_name }}" \
            "${{ inputs.version }}" \
            "${{ github.event.pull_request.head.ref }}"

      - name: Release target check
        env:
          GH_TOKEN: ${{ github.token }}
        run: just VERSION="${{ steps.version.outputs.version }}" release-target-check

  runtime-assets:
    needs: release-context
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux64
            helper: target/release/krr-html-chromium-engine
          - os: macos-15
            platform: mac-arm64
            helper: target/release/krr-html-chromium-engine
          - os: macos-15-intel
            platform: mac-x64
            helper: target/release/krr-html-chromium-engine
          - os: windows-latest
            platform: win64
            helper: target/release/krr-html-chromium-engine.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: release-runtime-${{ matrix.platform }}

      - name: Build Chromium browser helper
        shell: bash
        run: cargo build --locked --release -p katana-render-runtime --bin krr-html-chromium-engine

      - name: Install pinned Chromium beside helper
        shell: bash
        run: |
          python3 scripts/chromium/install.py \
            --platform "${{ matrix.platform }}" \
            --manifest crates/katana-render-runtime/vendor/chromium/150.0.7871.115/manifest.json \
            --helper-bin "${{ matrix.helper }}" \
            --cache-dir tmp/chromium-cache \
            --fresh

      - name: Package and verify Chromium browser runtime
        shell: bash
        run: |
          python3 scripts/chromium/package_runtime.py \
            --version "${{ needs.release-context.outputs.version }}" \
            --platform "${{ matrix.platform }}" \
            --manifest crates/katana-render-runtime/vendor/chromium/150.0.7871.115/manifest.json \
            --helper-bin "${{ matrix.helper }}" \
            --krr-license LICENSE \
            --output-dir dist

      - name: Upload verified runtime archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-runtime-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [release-context, runtime-assets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: release-ubuntu-stable-publish

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Verify release package
        run: just VERSION="${{ needs.release-context.outputs.version }}" release-verify

      - name: Download verified runtime archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: chromium-runtime-*
          path: dist
          merge-multiple: true

      - name: Create release tag
        env:
          TAG: ${{ needs.release-context.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/release/create-release-tag.sh "${TAG}" origin

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-context.outputs.version }}
        run: |
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --verify-tag --draft --generate-notes
          fi

      - name: Upload immutable Chromium runtime assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-context.outputs.version }}
        run: bash scripts/release/upload-runtime-assets.sh "${TAG}" dist

      - name: Publish complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-context.outputs.version }}
        run: gh release edit "${TAG}" --draft=false --latest --verify-tag

      - name: Publish crates.io
        if: github.event_name == 'pull_request' || inputs.publish_crates == true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/release/publish-crates.sh "${{ needs.release-context.outputs.version }}"
